<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Ledger</title>
<meta name="robots" content="noindex">
<script>
  // Farm Ledger moved to v10. Clear the old v9 app's saved copy on this phone, then go to the new app.
  (async () => {
    try { const regs = await navigator.serviceWorker?.getRegistrations?.() || []; for (const r of regs) if (new URL(r.scope).pathname.startsWith("/farm-ledger/")) await r.unregister(); } catch (e) {}
    try { for (const k of await caches.keys()) if (k.startsWith("farm-ledger-v9")) await caches.delete(k); } catch (e) {}
    location.replace("/farm-ledger-v10/" + location.hash);
  })();
</script>
