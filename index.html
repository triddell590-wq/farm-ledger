// Photos live in state.photos (see persistPhoto/deletePhoto above), addressed by a
// generated id. These hold the in-progress photo for whichever form is open, before
// the record itself (and its photoId reference) is saved.
let pendingMedPhotoId = null;
let pendingMedPhotoData = null;
let pendingPurPhotoId = null;
let pendingPurPhotoData = null;

function resizeImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width >= height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read image"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

async function scanMedicineLabel() {
  const statusEl = document.getElementById("med-ocr-status");
  if (!pendingMedPhotoData) {
    if (statusEl) statusEl.textContent = "Take a photo of the label first.";
    return;
  }
  if (statusEl) statusEl.textContent = "Reading the label…";
  try {
    const text = await ocrImage(pendingMedPhotoData);
    const parsed = parseMedicineLabel(text);
    const filledAny = applyOcrFields(parsed);
    if (statusEl) {
      statusEl.textContent = filledAny
        ? "Check the highlighted fields against the label, then pick the animals and quantity."
        : "Couldn't make out the label. Fill in the fields below, or retake the photo in better light.";
    }
  } catch (e) {
    console.error("OCR failed", e);
    if (statusEl) statusEl.textContent = "Couldn't read the label this time. Fill in the fields below by hand, or retake the photo.";
  }
}

function parseMedicineLabel(text) {
  const result = {};
  const lines = text.split(/\r?\n+/).map((l) => l.trim()).filter(Boolean);
  const batchMatch = text.match(/(?:batch|lot)[\s:.\-]*([A-Za-z0-9\-\/]{3,})/i);
  if (batchMatch) result.batchNumber = batchMatch[1];
  const wdMatch = text.match(/withdrawal[^\d]{0,25}(\d+)\s*(?:day|days|hr|hrs|hour)/i);
  if (wdMatch) result.withdrawalMeatDays = wdMatch[1];
  const skipLine = /^(batch|lot|exp|use by|withdrawal|net|contents|qty|quantity)/i;
  const nameLine = lines.find((l) => /[A-Za-z]{3,}/.test(l) && !skipLine.test(l));
  if (nameLine) result.productName = nameLine.slice(0, 60);
  return result;
}

function applyOcrFields(parsed) {
  const map = { productName: "f-med-name", batchNumber: "f-med-batch", withdrawalMeatDays: "f-med-wd-meat" };
  let filledAny = false;
  Object.keys(map).forEach((k) => {
    if (parsed[k] != null && parsed[k] !== "") {
      const el = document.getElementById(map[k]);
      if (el) { el.value = parsed[k]; el.classList.add("ocr-filled"); filledAny = true; }
    }
  });

}

/* ====================================================================
   DAERA paperwork (v8)
   - Medicine Record: DAERA veterinary medicine administration columns
   - Medicine Purchases: DAERA veterinary medicine purchase columns
   - Herd Register: DAERA MC3 herd register columns, fed by mart dockets
   ==================================================================== */
const DAERA_BREEDS = [["AA","Aberdeen Angus"],["AU","Aubrac"],["AYR","Ayrshire"],["BB","Belgian Blue"],["BRB","British Blue"],["CH","Charolais"],["DAQ","Blonde d'Aquitaine"],["DEX","Dexter"],["FKV","Fleckvieh"],["FR","Friesian"],["GAL","Galloway"],["HER","Hereford"],["HI","Highland"],["HOL","Holstein"],["JER","Jersey"],["LIM","Limousin"],["LUI","Luing"],["MB","Montbeliarde"],["NOR","Normande"],["PAR","Parthenaise"],["SAL","Salers"],["SBR","Brown Swiss"],["SH","Shorthorn"],["SHB","Beef Shorthorn"],["SIM","Simmental"],["ST","Stabiliser"],["WB","Welsh Black"]];
const DAERA_COLOURS = [["B","Black"],["BL","Blue"],["BR","Brindle"],["D","Dun"],["R","Red"],["RN","Roan"],["BW","Black & White"],["BLW","Blue & White"],["DW","Dun & White"],["RW","Red & White"],["W","White"]];
const KNOWN_MARTS = [
  { match: /swatragh/i, name: "Swatragh Livestock Market", address: "29 Garvagh Road, Swatragh, Co. Derry, BT46 5QE" },
];

function breedCode(b) {
  if (!b) return "";
  const u = String(b).trim().toUpperCase();
  if (DAERA_BREEDS.some(([c]) => c === u)) return u;
  const byName = DAERA_BREEDS.find(([, n]) => n.toUpperCase() === u);
  if (byName) return byName[0];
  const legacy = typeof BREED_CODES !== "undefined" && BREED_CODES[u];
  if (legacy) { const h = DAERA_BREEDS.find(([, n]) => n.toUpperCase() === legacy.toUpperCase()); if (h) return h[0]; }
  return u;
}
function sexCode(s) {
  s = String(s || "").toLowerCase();
  if (/heifer|cow|female/.test(s)) return "F";
  if (/steer|bullock/.test(s)) return "M";
  if (/bull/.test(s)) return "B";
  if (/male/.test(s)) return "M";
  return "";
}
function codeOptions(list, selected, blankLabel) {
  return `<option value="">${blankLabel || "Choose"}</option>` + list.map(([c, n]) => `<option value="${c}" ${c === selected ? "selected" : ""}>${c} · ${esc(n)}</option>`).join("");
}
function ddmmyy(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y.slice(2)}`; }

// NI/UK cattle ear tag: country (XI or UK), a 0/9 digit, 6-digit herd mark,
// 4-digit animal number and a check digit. The check digit is
// ("9" + herd + animal) mod 7, plus 1 — verified against real Swatragh dockets.
function tagCheckDigit(herd6, animal4) { return (Number("9" + herd6 + animal4) % 7) + 1; }
function parseTag(str) {
  const m = String(str || "").toUpperCase().match(/(XI|UK)\s*([09])\s*(\d{6})\s*(\d{4})\s*(\d)?/);
  if (!m) return null;
  const expected = tagCheckDigit(m[3], m[4]);
  const check = m[5] != null ? Number(m[5]) : null;
  return { country: m[1], lead: m[2], herd: m[3], animal: m[4], check, expected, valid: check === expected,
    formatted: `${m[1]} ${m[2]} ${m[3]} ${m[4]} ${check != null ? check : expected}` };
}
function tagStatusHtml(str) {
  const p = parseTag(str);
  if (!str) return "";
  if (!p) return `<span class="tag-chk warn">Not a full XI/UK tag, check it</span>`;
  if (p.check == null) return `<span class="tag-chk warn">Check digit should be ${p.expected}</span>`;
  return p.valid ? `<span class="tag-chk ok">Tag checks out</span>` : `<span class="tag-chk bad">Check digit wrong, should end ${p.expected}. Misread?</span>`;
}

/* ---------- mart docket reader ---------- */
function isoFromParts(d, m, y) {
  if (y.length === 2) y = "20" + y;
  d = String(d).padStart(2, "0"); m = String(m).padStart(2, "0");
  if (Number(m) < 1 || Number(m) > 12 || Number(d) < 1 || Number(d) > 31) return "";
  return `${y}-${m}-${d}`;
}
function parseDocket(text) {
  const t = String(text || "").replace(/[|]/g, " ");
  const out = { date: "", herdNo: "", statementNo: "", mart: null, animals: [], total: "" };
  const d = t.match(/Date\s*[:.]?\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[\/.]\s*(\d{2,4})/i);
  if (d) out.date = isoFromParts(d[1], d[2], d[3]);
  const h = t.match(/Herd\s*No\.?\s*[:.]?\s*(\d{6})/i); if (h) out.herdNo = h[1];
  const s = t.match(/Statement\s*Number\s*[:.]?\s*(\d{5,})/i); if (s) out.statementNo = s[1];
  out.mart = KNOWN_MARTS.find((m) => m.match.test(t)) || null;
  const sale = out.date || todayStr();
  const bullocks = /\bBK\b/.test(t);
  const lines = t.split(/\r?\n/);
  const seen = new Set();
  lines.forEach((line) => {
    const re = /(?:[Xx]\s*[Il1!tT|]?|[Il1!tT|])\s*[0Oo]\s*(\d{6})\s*(\d{4})([^\/\n]{1,6}?)\s*[\/.]\s*(\d{1,2})\s*[\/.]\s*(\d{2,4})/g;
    let m;
    while ((m = re.exec(line))) {
      const herd = m[1], animal = m[2];
      if (seen.has(herd + animal)) continue;
      seen.add(herd + animal);
      const expected = tagCheckDigit(herd, animal);
      // Between the animal number and the first "/" sit the check digit and the
      // day of birth, often run together ("724" = check 7, day 24).
      const raw = m[3]; const squashed = raw.replace(/\s+/g, "");
      let day = "", readCheck = null;
      if (squashed.length >= 3) { readCheck = squashed[0]; day = squashed.slice(1).replace(/\D/g, ""); }
      else if (squashed.length === 2) {
        if (!/\d/.test(squashed[0]) || /\s/.test(raw.trim()) || Number(squashed) > 31) { readCheck = squashed[0]; day = squashed.slice(1); }
        else day = squashed;
      } else day = squashed;
      let dob = isoFromParts(day || "0", m[4], m[5]);
      let dobFlag = "";
      if (dob && dob > sale) { // e.g. 26 misread as 28
        const fixed = sale.slice(0, 4) + dob.slice(4);
        dob = fixed <= sale ? fixed : dob; dobFlag = "Year looked wrong, check date of birth";
      }
      if (!dob) dobFlag = "Couldn't read date of birth";
      const checkMismatch = readCheck != null && /\d/.test(readCheck) && Number(readCheck) !== expected;
      const rest = line.slice(m.index + m[0].length).toUpperCase();
      const sc = rest.replace(/[^A-Z0-9 ]/g, " ").match(/(?:^|\s)(?:Y\s*|N\s*){0,2}([MFB])\s*(BLW|BW|DW|RW|RN|BR|BL|B|D|R|W)(?![A-Z])/);
      const sexLetter = sc ? sc[1] : "";
      const colour = sc ? sc[2] : "";
      // Marts print DAERA sex codes: F = female, M = male (bullock/steer), B = bull.
      const sex = sexLetter === "F" ? "Heifer" : sexLetter === "M" ? "Steer" : sexLetter === "B" ? "Bull" : (bullocks ? "Steer" : "");
      const before = line.slice(0, m.index);
      const lotM = before.match(/(\d{3,4})\s*\W{0,3}\s*$/);
      const wt = rest.match(/\b(\d{2,4})\.\d\b/);
      const pr = rest.match(/\b(\d{1,2},\d{3}\.\d{2}|\d{3,5}\.\d{2})\b/);
      out.animals.push({
        tag: `XI 0 ${herd} ${animal} ${expected}`, checkMismatch, dob, dobFlag, sex, colour,
        fqa: /F\s*Q/.test(rest), lot: lotM ? lotM[1] : "",
        weight: wt ? wt[1] : "", price: pr ? pr[1].replace(/,/g, "") : "",
      });
    }
  });
  const money = (t.match(/\b\d{1,2},\d{3}\.\d{2}\b/g) || []).map((v) => Number(v.replace(/,/g, "")));
  const n = out.animals.length;
  if (n) {
    if (out.animals.every((a) => a.price)) out.total = String(out.animals.reduce((s, a) => s + Number(a.price), 0));
    else if (money.length === n) out.total = String(money.reduce((s, v) => s + v, 0));
    else if (money.length === 2 * n) out.total = String(money.reduce((s, v) => s + v, 0) / 2);
  }
  return out;
}

/* ---------- medicine record (administration) ---------- */
function saveMedicine(editId) {
  const old = editId ? state.medicine.find((m) => m.id === editId) : null;
  const productName = document.getElementById("f-med-name").value.trim();
  const date = document.getElementById("f-med-date").value || todayStr();
  const lastDate = document.getElementById("f-med-last").value || date;
  if (!productName) { window.alert("Name of the medicine is required."); return; }
  if (lastDate < date) { window.alert("Last date of use can't be before the first date of use."); return; }
  const batchNumber = document.getElementById("f-med-batch").value.trim();
  const source = document.getElementById("f-med-source").value.trim();
  const quantity = document.getElementById("f-med-qty").value.trim();
  const quantityUnit = document.getElementById("f-med-unit").value;
  const administeredBy = document.getElementById("f-med-by").value.trim();
  const wdMeat = Number(document.getElementById("f-med-wd-meat").value) || 0;
  const wdMilk = Number(document.getElementById("f-med-wd-milk").value) || 0;
  const notUsed = false;
  const brokenNeedle = document.getElementById("f-med-broken").checked;
  const injectionSite = val("f-med-site");
  const withdrawalOther = val("f-med-wd-other");
  if (brokenNeedle && !injectionSite) { window.alert("Broken needle policy: record the injection site, and mark the animal."); return; }
  const checkedTags = Array.from(document.querySelectorAll(".animal-chip.on")).map((c) => c.getAttribute("data-value"));
  try { if (administeredBy) localStorage.setItem("fl-last-admin", administeredBy); } catch (e) {}
  const extraTagsRaw = document.getElementById("f-med-extra-tags").value.trim();
  const extraTags = extraTagsRaw ? extraTagsRaw.split(",").map((t) => t.trim()).filter(Boolean) : [];
  const animalTags = [...new Set([...checkedTags, ...extraTags])];
  if (!animalTags.length) { window.alert("Pick the animal(s) treated. DAERA needs each treated animal to be traceable."); return; }
  // DAERA: withdrawal ends = withdrawal period added to the LAST date of use.
  const withdrawalEndDateMeat = wdMeat > 0 ? addDays(lastDate, wdMeat) : null;
  const withdrawalEndDateMilk = wdMilk > 0 ? addDays(lastDate, wdMilk) : null;
  const record = {
    id: old ? old.id : uid(), date, lastDate, productName, batchNumber, source, quantity, quantityUnit, administeredBy,
    animalTags, withdrawalMeatDays: wdMeat || null, withdrawalMilkDays: wdMilk || null,
    withdrawalEndDateMeat, withdrawalEndDateMilk, withdrawalOther, brokenNeedle, injectionSite, notUsed, photoId: pendingMedPhotoId || (old ? old.photoId || null : null),
  };
  const doseInfo = collectDoses(animalTags);
  if (doseInfo.error) { window.alert(doseInfo.error); return; }
  Object.assign(record, doseInfo.fields);
  rememberMedProduct(record);
  let herdChanged = false;
  if (old) {
    Object.assign(record, editStamp(old, record));
    const i = state.medicine.indexOf(old); state.medicine[i] = record;
    if (pendingMedPhotoId && old.photoId && old.photoId !== pendingMedPhotoId) deletePhoto(old.photoId);
    // Replace the animal-log lines this record wrote, so the animal's history matches the corrected record.
    state.herd.forEach((a) => {
      const before = (a.logs || []).length;
      a.logs = (a.logs || []).filter((l) => !(l.medId === old.id || (!l.medId && l.type === "Medication" && l.date === old.date && String(l.note || "").startsWith(old.productName || "\u0000"))));
      if (a.logs.length !== before) herdChanged = true;
    });
  } else state.medicine.unshift(record);
  persistMedicine();
  if (pendingMedPhotoId && pendingMedPhotoData) persistPhoto(pendingMedPhotoId, pendingMedPhotoData);
  animalTags.forEach((tag) => {
    const a = state.herd.find((x) => normTag(x.tag) === normTag(tag));
    if (a) {
      const wdNote = withdrawalEndDateMeat ? ` · withdrawal ends ${formatShortDate(withdrawalEndDateMeat)}` : "";
      const dd = (record.doses || []).find((x) => normTag(x.tag) === normTag(tag));
      if (dd && dd.weightKg) { a.lastWeightKg = dd.weightKg; a.lastWeightDate = date; a.lastWeightEst = !!dd.est; }
      a.logs.push({ id: uid(), medId: record.id, type: "Medication", date,
        note: `${productName}${batchNumber ? " (batch " + batchNumber + ")" : ""}${dd && dd.dose ? " — " + dd.dose + quantityUnit + (dd.weightKg ? ` (${dd.weightKg}kg${dd.est ? " est." : ""})` : "") : quantity ? " — " + quantity + quantityUnit + " total" : ""}${administeredBy ? " by " + administeredBy : ""}${lastDate !== date ? " · last dose " + formatShortDate(lastDate) : ""}${wdNote}${brokenNeedle ? " · BROKEN NEEDLE at " + injectionSite : ""}` });
      herdChanged = true;
    }
  });
  if (herdChanged) persistHerd();
  pendingMedPhotoId = null; pendingMedPhotoData = null;
  state.modal = null;
  render();
}

function removeMedicine(id) {
  if (!window.confirm("Delete this medicine record? DAERA requires these to be kept for 5 years. Only remove it if it was logged in error.")) return;
  const rec = state.medicine.find((m) => m.id === id);
  state.medicine = state.medicine.filter((m) => m.id !== id);
  persistMedicine();
  if (rec && rec.photoId) deletePhoto(rec.photoId);
  state.modal = null;
  render();
}

function addDays(dateStr, days) {

function renderRegister() {

function handleCattlePhoto(el) {
  const file = el.files && el.files[0];
  if (!file) return;
  const status = document.getElementById("cat-status");
  resizeImageFile(file, 1800, 0.85).then(async (dataUrl) => {
    pendingPurPhotoId = uid(); pendingPurPhotoData = dataUrl;
    const card = document.getElementById("cat-scan-card"); if (card) card.style.display = "none";
    const prev = document.getElementById("cat-photo-preview");
    if (prev) prev.innerHTML = `<img class="photo-thumb" src="${dataUrl}" alt="Mart docket" />`;
    if (status) status.textContent = "Reading the docket…";
    try {
      const d = parseDocket(await ocrImage(dataUrl));
      if (d.date) document.getElementById("f-cat-date").value = d.date;
      if (d.mart) document.getElementById("f-cat-from").value = `${d.mart.name}, ${d.mart.address}`;
      if (d.statementNo) document.getElementById("f-cat-stmt").value = d.statementNo;
      if (d.total) { const t = document.getElementById("f-cat-total"); t.value = d.total; t.classList.add("ocr-filled"); }
      if (d.herdNo && !(state.keeper && state.keeper.herdNo)) { state.keeper = Object.assign({}, state.keeper || {}, { herdNo: d.herdNo }); persistKeeper(); }
      const box = document.getElementById("cat-rows");
      if (d.animals.length) {
        box.innerHTML = d.animals.map(cattleRowHtml).join("");
        const bad = d.animals.filter((a) => a.checkMismatch || a.dobFlag).length;
        status.textContent = `Found ${d.animals.length} ${d.animals.length === 1 ? "animal" : "animals"}.${bad ? ` ${bad} need a closer look (flagged).` : ""} Set the breed, then check every tag and date against the docket. Lot numbers and prices often don't read, so fill them in if missing.${d.total ? " Check the total includes commission." : ""}`;
      } else {
        status.textContent = "Couldn't pick out any tags. Retake the photo flat and straight on, or type the animals in below.";
      }
    } catch (e) {
      console.error("docket OCR failed", e);
      if (status) status.textContent = "Couldn't read the docket this time. Type the animals in below, or retake the photo.";
    }
    el.value = "";
  }).catch(() => { if (status) status.textContent = "Couldn't open that photo. Try taking it again."; });
}
function saveCattlePurchase() {
  const rows = Array.from(document.querySelectorAll("#cat-rows .cat-row")).map((r) => ({
    lot: r.querySelector(".c-lot").value.trim(), tag: r.querySelector(".c-tag").value.trim().replace(/\s+/g, " ").toUpperCase(),
    dob: r.querySelector(".c-dob").value, sex: r.querySelector(".c-sex").value, colour: r.querySelector(".c-colour").value,
    breed: r.querySelector(".c-breed").value, weight: r.querySelector(".c-wt").value.trim(), price: r.querySelector(".c-price").value.trim(),
  })).filter((r) => r.tag);
  if (!rows.length) { window.alert("Add at least one animal with an ear tag."); return; }
  const missing = rows.filter((r) => !r.dob || !r.sex || !r.colour || !r.breed);
  if (missing.length) { window.alert(`DAERA's register needs date of birth, sex, colour and breed for every animal. Missing on: ${missing.map((r) => r.tag).join(", ")}`); return; }
  const badTags = rows.filter((r) => { const p = parseTag(r.tag); return !p || !p.valid; });
  if (badTags.length && !window.confirm(`These tags don't pass the ear-tag check, so one is probably misread:\n${badTags.map((r) => r.tag).join("\n")}\n\nSave anyway?`)) return;
  const date = document.getElementById("f-cat-date").value || todayStr();
  const fromText = val("f-cat-from");
  if (!fromText) { window.alert("Add where the cattle moved from (mart or seller name and address)."); return; }
  const statementNo = val("f-cat-stmt");
  const totalRaw = val("f-cat-total");
  const priceSum = rows.reduce((s, r) => s + (parseMoney(r.price) || 0), 0);
  const cost = totalRaw ? parseMoney(totalRaw) : priceSum || null;
  const fieldEl = document.getElementById("f-cat-field");
  const fieldId = (fieldEl && fieldEl.value) || null;
  const toBooks = document.getElementById("f-cat-books").checked;
  const purchaseId = uid();
  const martName = fromText.split(",")[0].trim();
  const skipped = []; const added = [];
  rows.forEach((r) => {
    const m = herdMatch(r.tag);
    if (m && m.kind === "exact") { skipped.push(r.tag); return; }
    state.herd.unshift({
      id: uid(), tag: r.tag, name: "", dob: r.dob, sex: r.sex, breed: r.breed, colour: r.colour, fieldId,
      onDate: date, fromText, lot: r.lot, purchaseId, weightKg: r.weight ? Number(r.weight) : null, price: r.price ? parseMoney(r.price) : null,
      logs: [{ id: uid(), type: "Note", date, note: `Bought at ${martName}${r.lot ? ", lot " + r.lot : ""}${r.weight ? ", " + r.weight + "kg" : ""}${r.price ? ", " + currency(parseMoney(r.price)) : ""}` }],
    });
    added.push(r.tag);
  });
  if (!added.length) { window.alert("All of these are already in your herd, so nothing was added."); return; }
  state.purchases.unshift({
    id: purchaseId, kind: "livestock", date, supplier: martName, fromText, statementNo, cost,
    productName: `${added.length} cattle`, quantity: added.join(", "), animalTags: added,
    animals: rows.filter((r) => added.includes(r.tag)).map((r) => ({ tag: r.tag, lot: r.lot, weight: r.weight, price: r.price })),
    notified: false, photoId: pendingPurPhotoId || null,
  });
  if (toBooks && cost > 0) {
    state.finance.unshift({ id: uid(), kind: "expense", category: "Animal Purchase", amount: cost, date, note: `${martName}${statementNo ? " statement " + statementNo : ""}: ${added.length} cattle`, purchaseId });
    persistFinance();
  }
  persistHerd(); persistPurchases();
  if (pendingPurPhotoId && pendingPurPhotoData) persistPhoto(pendingPurPhotoId, pendingPurPhotoData);
  pendingPurPhotoId = null; pendingPurPhotoData = null;
  state.modal = null; state.tab = "paperwork"; state.paperworkView = "register";
  render();
  if (skipped.length) window.alert(`Added ${added.length}. Already in your herd, so skipped: ${skipped.join(", ")}`);
}
function markNotified(id) {

  p.notified = true; p.notifiedAt = new Date().toISOString();

function savePurchase(editId) {
  const old = editId ? state.purchases.find((p) => p.id === editId) : null;
  const productName = val("f-pur-name");
  if (!productName) { window.alert("Name of the medicine is required."); return; }
  const supplierName = val("f-pur-supplier");
  if (supplierName && !knownSupplierAddress(supplierName) && !val("f-pur-addr") && !(old && old.supplierAddress)) { window.alert("First time using this supplier: DAERA needs their full name and address recorded."); return; }
  const date = document.getElementById("f-pur-date").value || todayStr();
  const costRaw = document.getElementById("f-pur-cost").value;
  const rec = {
    id: old ? old.id : uid(), kind: "medicine", date, productName, supplier: val("f-pur-supplier"), quantity: val("f-pur-qty"),
    supplierAddress: val("f-pur-addr") || (old ? old.supplierAddress || "" : ""), batchNumber: val("f-pur-batch"), expiryDate: document.getElementById("f-pur-expiry").value || "",
    cost: costRaw ? parseMoney(costRaw) : null, photoId: pendingPurPhotoId || (old ? old.photoId || null : null),
  };
  if (old) {
    Object.assign(rec, editStamp(old, rec));
    state.purchases[state.purchases.indexOf(old)] = rec;
    if (pendingPurPhotoId && old.photoId && old.photoId !== pendingPurPhotoId) deletePhoto(old.photoId);
  } else state.purchases.unshift(rec);
  persistPurchases();
  if (pendingPurPhotoId && pendingPurPhotoData) persistPhoto(pendingPurPhotoId, pendingPurPhotoData);
  pendingPurPhotoId = null; pendingPurPhotoData = null;
  state.modal = null; render();
}
function removePurchase(id) {
  const rec = state.purchases.find((p) => p.id === id);
  const isLs = rec && (rec.kind === "livestock" || isLegacyCattlePurchase(rec));
  if (!window.confirm(isLs ? "Delete this purchase record? The animals stay in your herd register, and its cost is removed from Books." : "Delete this purchase record? DAERA requires medicine purchase records to be kept for 5 years.")) return;
  state.purchases = state.purchases.filter((p) => p.id !== id);
  persistPurchases();
  if (state.finance.some((e) => e.purchaseId === id)) { state.finance = state.finance.filter((e) => e.purchaseId !== id); persistFinance(); }
  if (rec && rec.photoId) deletePhoto(rec.photoId);
  state.modal = null; render();
}

function printDaera(kind) {

  const area = document.getElementById("print-area");
  area.innerHTML = `<h1>${esc(d.title)}</h1>
    ${d.top ? `<div class="p-top">${d.top.map(([l, v]) => `<div><b>${esc(l)}:</b> ${esc(v)}</div>`).join("")}</div>` : ""}
    <table>${d.theadHtml || `<thead><tr>${d.headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>`}
    <tbody>${d.rows.length ? d.rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${d.headers.length}">No records</td></tr>`}</tbody></table>
    <p>${esc(d.note)} Printed ${formatLongDate(todayStr())} from Farm Ledger.</p>`;
  window.print();
}
function csvDaera(kind) {
  const d = daeraDoc(kind);
  const q = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [];
  if (d.top) d.top.forEach(([l, v]) => lines.push([q(l), q(v)].join(",")));
  lines.push(d.headers.map(q).join(","));
  d.rows.forEach((r) => lines.push(r.map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${d.title.replace(/[^A-Za-z]+/g, "-").toLowerCase()}-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- FQA inspection checklist ---------- */
// Source: LMC "Farm Quality Assurance Scheme Inspection Checklist" (FQAS Operations
// Manual SL fqas 311, V2 Oct 22). Page refs are to the LMC FQAS Record Book 2022.
function daysSince(iso) { return iso ? Math.floor((Date.now() - new Date(iso + "T12:00:00")) / 86400000) : Infinity; }
function medUseGaps(m) {
  const miss = [];
  if (!m.productName) miss.push("name");
  if (!(m.animalTags || []).length) miss.push("animal ID");
  if (!m.administeredBy) miss.push("person administering");
  if (!m.date) miss.push("first date");
  if (!m.quantity) miss.push("quantity");
  if (!m.batchNumber) miss.push("batch no.");
  if (!m.source) miss.push("source");
  if (m.brokenNeedle && !m.injectionSite) miss.push("injection site (broken needle)");
  return miss;
}
function medPurGaps(p) {
  const miss = [];
  if (!p.productName) miss.push("name");
  if (!p.quantity) miss.push("quantity");
  if (!p.batchNumber) miss.push("batch no.");
  if (!p.expiryDate) miss.push("expiry date");
  if (!p.supplier) miss.push("supplier");
  else if (isFirstUseOfSupplier(p) && !p.supplierAddress) miss.push("supplier address (first time)");
  return miss;
}
function registerGaps(a) {
  const miss = [];
  if (!parseTag(a.tag)) miss.push("full ear tag");
  if (!a.colour) miss.push("colour");
  if (!breedCode(a.breed)) miss.push("breed");
  if (!sexCode(a.sex)) miss.push("sex");
  if (!a.dob) miss.push("date of birth");
  if (a.onDate && !a.fromText) miss.push("moved from");
  if (!a.onDate && !a.damTag) miss.push("dam's tag or date moved on");
  if (a.offDate && !a.offTo) miss.push("moved to / dead");
  if (a.offTo === "Dead" && !a.disposal) miss.push("carcass disposal");
  return miss;
}

      else if (action === "map-fullscreen") { toggleMapFull(); }
      else if (action === "imagery") { setImagery(el.getAttribute("data-mode")); }
      else if (action === "field-cattle") { state.modal = { type: "fieldCattle", id: el.getAttribute("data-id") }; render(); }
      else if (action === "save-field-cattle") { saveFieldCattle(el.getAttribute("data-id")); }
      else if (action === "fc-all") { document.querySelectorAll(".fc-chk").forEach((c) => (c.checked = true)); }
      else if (action === "fc-none") { document.querySelectorAll(".fc-chk").forEach((c) => (c.checked = false)); }
      else if (action === "edit-field") { state.modal = { type: "editField", id: el.getAttribute("data-id") }; render(); }
      else if (action === "save-field-edit") { saveFieldEdit(el.getAttribute("data-id")); }
      else if (action === "redraw-field") { const id = el.getAttribute("data-id"); state.modal = null; state.tab = "land"; drawState.editingId = id; selectedFieldId = id; startDrawField(); }
      else if (action === "goto") { state.modal = null; state.tab = el.getAttribute("data-tab"); const v = el.getAttribute("data-view"); if (v) state.paperworkView = v; render(); window.scrollTo(0, 0); }
      else if (action === "fqa-tick") { fqaToggle(el.getAttribute("data-id"), "done"); }
      else if (action === "fqa-na") { fqaToggle(el.getAttribute("data-id"), "na"); }
      else if (action === "map-jump") { jumpTo(el.getAttribute("data-kind"), el.getAttribute("data-id")); }
      else if (action === "open-places") { state.modal = { type: "places" }; render(); }
      else if (action === "save-place") { savePlace(el.getAttribute("data-where")); }
      else if (action === "set-farm-gps") { savePlace("gps", "Farm"); }
      else if (action === "delete-place") { deletePlace(el.getAttribute("data-id")); }
      else if (action === "feed-new-group") { state.modal = { type: "feedGroup" }; render(); }
      else if (action === "feed-edit-group") { state.modal = { type: "feedGroup", id: el.getAttribute("data-id") }; render(); }
      else if (action === "feed-save-group") { saveFeedGroup(el.getAttribute("data-id")); }
      else if (action === "feed-delete-group") { deleteFeedGroup(el.getAttribute("data-id")); }
      else if (action === "feed-open-group") { state.modal = { type: "feedGroupDetail", id: el.getAttribute("data-id") }; render(); }
      else if (action === "feed-ration") { state.modal = { type: "feedRation", id: el.getAttribute("data-id") }; render(); }
      else if (action === "feed-save-ration") { saveFeedRation(el.getAttribute("data-id")); }
      else if (action === "feed-del-ration") { deleteFeedRation(el.getAttribute("data-id"), el.getAttribute("data-from")); }
      else if (action === "feed-adjust") { state.modal = { type: "feedAdjust", id: el.getAttribute("data-id") }; render(); }
      else if (action === "feed-save-adjust") { saveFeedAdjust(el.getAttribute("data-id")); }
      else if (action === "feed-skip") { toggleFeedSkip(el.getAttribute("data-id")); }
      else if (action === "feed-costs") { state.modal = { type: "feedCosts" }; render(); }
      else if (action === "feed-costs-all") { const draft = {}; document.querySelectorAll(".fd-use").forEach((sel) => { const id = sel.getAttribute("data-id"); const kg = document.querySelector(`.fd-kg[data-id="${id}"]`); draft[id] = { use: sel.value, kg: kg ? kg.value : "" }; }); state.modal = { type: "feedCosts", all: true, draft }; render(); }
      else if (action === "feed-save-costs") { saveFeedCosts(); }
      else if (action === "feed-silage") { state.modal = { type: "feedSilage" }; render(); }
      else if (action === "feed-save-silage") { saveFeedSilage(); }
    });
  });
  root.querySelectorAll("[data-action-change]").forEach((el) => {
    el.addEventListener("change", () => {
      const action = el.getAttribute("data-action-change");
      if (action === "reassign-field") { reassignField(el.getAttribute("data-id"), el.value); }
      else if (action === "preview-med-photo") { handleMedPhotoChange(el); }
      else if (action === "preview-pur-photo") { handlePurPhotoChange(el); }
      else if (action === "imp-photo") { handleImportPhoto(el); }
      else if (action === "cat-photo") { handleCattlePhoto(el); }
    });
  });
  if (document.getElementById("dose-weights")) renderDoseWeights(true);
  root.querySelectorAll(".fd-use").forEach((sel) => sel.addEventListener("change", () => {
    const kg = root.querySelector(`.fd-kg[data-id="${sel.getAttribute("data-id")}"]`);
    if (kg) kg.style.visibility = sel.value === "meal" ? "visible" : "hidden";
  }));
  attachSheetSwipe();
}

// Drag the sheet's header down to dismiss it, like a native iOS sheet.
function attachSheetSwipe() {
  const head = document.getElementById("sheet-head");
  const sheet = document.getElementById("sheet");
  if (!head || !sheet) return;
  let startY = null, dy = 0;
  head.addEventListener("touchstart", (e) => { startY = e.touches[0].clientY; dy = 0; sheet.style.transition = "none"; }, { passive: true });
  head.addEventListener("touchmove", (e) => {
    if (startY == null) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  head.addEventListener("touchend", () => {
    if (startY == null) return;
    startY = null;
    sheet.style.transition = "transform .22s ease-out";
    if (dy > 110) {
      sheet.style.transform = "translateY(100%)";
      setTimeout(() => { state.modal = null; render(); }, 200);
    } else {
      sheet.style.transform = "";
    }
  });
}

// Accepts "12.50", "£12.50", "1,250" etc.
function parseMoney(v) {
  const n = Number(String(v || "").replace(/[£,\s]/g, ""));
  return isFinite(n) ? n : 0;
}

function saveCalf() {
  const tag = document.getElementById("f-tag").value.trim();
  const dob = document.getElementById("f-dob").value;
  if (!tag || !dob) return;
  const name = document.getElementById("f-name").value.trim();
  const breed = document.getElementById("f-breed").value.trim();
  const sex = document.getElementById("f-sex").value;
  const fieldId = document.getElementById("f-field").value || null;
  state.herd.unshift({ id: uid(), tag, name, dob, sex, breed, fieldId, logs: [] });
  persistHerd();
  state.modal = null;
  render();
}

function saveEntry() {
  const amount = parseMoney(document.getElementById("f-amount").value);
  if (!amount || amount <= 0) return;
  const category = document.getElementById("f-category").value;
  const date = document.getElementById("f-date").value || todayStr();
  const note = document.getElementById("f-note").value.trim();
  state.finance.unshift({ id: uid(), kind: state.entryKind, category, amount, date, note });
  persistFinance();
  state.modal = null;
  render();
}

function saveLog(animalId) {
  const note = document.getElementById("f-log-note").value.trim();
  if (!note) return;
  const type = document.getElementById("f-log-type").value;
  const date = document.getElementById("f-log-date").value || todayStr();
  const a = state.herd.find((x) => x.id === animalId);
  if (!a) return;
  a.logs.push({ id: uid(), type, note, date });
  persistHerd();
  render();
}

function removeAnimal(id) {
  state.herd = state.herd.filter((a) => a.id !== id);
  persistHerd();
  state.modal = null;
  render();
}

function saveField() {
  const name = document.getElementById("f-fieldname").value.trim();
  const acreage = parseMoney(document.getElementById("f-acreage").value);
  if (!name) { window.alert("Give the field a name."); return; }
  if (!acreage || acreage <= 0) { window.alert("Enter the acreage (it's filled in for you when you draw the field)."); return; }
  const type = document.getElementById("f-fieldtype").value;
  const description = document.getElementById("f-fielddesc").value.trim();
  const polygon = (state.modal && state.modal.polygon) || null;
  state.fields.push({ id: uid(), name, acreage, type, description, polygon });
  persistFields();
  state.modal = null;
  render();
}

function removeField(id) {
  if (!window.confirm("Remove this field? Any cattle assigned to it will become unassigned.")) return;
  state.fields = state.fields.filter((f) => f.id !== id);
  state.herd = state.herd.map((a) => (a.fieldId === id ? { ...a, fieldId: null } : a));
  persistFields();
  persistHerd();
  state.modal = null;
  render();
}

function reassignField(animalId, fieldId) {
  const a = state.herd.find((x) => x.id === animalId);
  if (!a) return;
  a.fieldId = fieldId || null;
  persistHerd();
  render();
}

function deleteEntry(id) {
  const entry = state.finance.find((e) => e.id === id);
  if (!entry) return;
  const label = `${entry.kind === "expense" ? "expense" : "revenue"} of ${currency(entry.amount)} (${entry.category})`;
  if (!window.confirm(`Delete this ${label}?`)) return;
  state.finance = state.finance.filter((e) => e.id !== id);
  persistFinance();
  render();
}

/* ---------- init ---------- */
// Sign-in gate: the farm data is locked to Tom's account by Firestore rules,
// so nothing loads (and nothing falls back to local storage) until signed in.
function renderSignIn(msg) {
  root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--stone)">
    <form id="signin-form" style="width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:24px;box-shadow:var(--shadow);display:grid;gap:12px;font-family:inherit">
      <div style="font-size:22px;font-weight:700;color:var(--ink)">Farm Ledger</div>
      <div style="font-size:13px;color:var(--ink-2)">Sign in to open your farm records.</div>
      <input id="si-email" type="email" autocomplete="username" placeholder="Email" required style="padding:12px;border-radius:10px;border:1px solid var(--hair);font:inherit;font-size:16px">
      <input id="si-pass" type="password" autocomplete="current-password" placeholder="Password" required style="padding:12px;border-radius:10px;border:1px solid var(--hair);font:inherit;font-size:16px">
      <button type="submit" id="si-go" style="padding:12px;border:0;border-radius:10px;background:var(--grass);color:#fff;font:inherit;font-weight:600;font-size:16px">Sign in</button>
      <button type="button" id="si-reset" style="border:0;background:none;color:var(--ink-2);font:inherit;font-size:13px">Forgot password</button>
      <div id="si-msg" style="font-size:13px;color:var(--heather);min-height:1em">${msg ? esc(msg) : ""}</div>
      <div style="font-size:10px;color:var(--ink-3)">Build ${BUILD_VERSION}</div>
    </form></div>`;
  const f = document.getElementById("signin-form"), m = document.getElementById("si-msg");
  f.onsubmit = async (e) => {
    e.preventDefault(); m.textContent = "Signing in…";
    try { await firebase.auth().signInWithEmailAndPassword(val("si-email"), document.getElementById("si-pass").value); }
    catch (err) {
      const c = err && err.code;
      m.textContent = c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" ? "Email or password is wrong."
        : c === "auth/too-many-requests" ? "Too many tries. Wait a few minutes." : c === "auth/network-request-failed" ? "No internet connection. Sign-in needs signal the first time."
        : "Couldn't sign in (" + (c || err.message) + ").";
    }
  };
  document.getElementById("si-reset").onclick = async () => {
    const em = val("si-email"); if (!em) { m.textContent = "Type your email first."; return; }
    try { await firebase.auth().sendPasswordResetEmail(em); m.textContent = "Reset email sent."; } catch (err) { m.textContent = "Couldn't send reset email."; }
  };
}

let syncStarted = false;
function startSync() {
  if (syncStarted) return; syncStarted = true;
  if (window.BoardFeed) BoardFeed.init(db, FARM_CODE, () => state, BUILD_VERSION);
  db.collection("farms").doc(FARM_CODE).onSnapshot(
    (snap) => {
      const data = snap.data() || {};
      state.herd = data.herd || [];
      state.finance = data.finance || [];
      state.fields = fieldsFromCloud(data.fields);
      state.medicine = data.medicine || [];
      state.purchases = data.purchases || [];
      state.keeper = data.keeper || null;
      state.fqa = data.fqa || null;
      state.places = data.places || null;
      state.feed = data.feed || null;
      state.medProducts = data.medProducts || null;
      render();
      if (window.BoardFeed) BoardFeed.onData(data);
    },
    (err) => {
      console.error("Cloud sync connection failed:", err);
      syncStarted = false;
      // Never fall back to local storage here: edits made offline-from-cloud
      // would split the records. Ask to sign in again instead.
      renderSignIn(err && err.code === "permission-denied" ? "This account doesn't have access to the farm records." : "Lost connection to your farm records. Sign in again.");
    }
  );
  db.collection("farms").doc(FARM_CODE).collection("photos").onSnapshot(
    (snap) => {
      const map = {};
      snap.forEach((doc) => { map[doc.id] = doc.data().dataUrl; });
      state.photos = map;
      render();
    },
    (err) => { console.error("Photo sync connection failed:", err); }
  );
}

function boot() {
  initSync();
  if (!syncEnabled || !firebase.auth) {
    root.innerHTML = `<div style="padding:40px 24px;font-family:-apple-system,sans-serif;text-align:center">Farm Ledger didn't start properly.<br><br><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:12px;background:#2F5D3A;color:#fff;font:600 16px -apple-system,sans-serif">Try again</button></div>`;
    return;
  }
  firebase.auth().onAuthStateChanged((user) => { if (user) startSync(); else renderSignIn(); });
}

try {
  boot();
} catch (err) {
  document.getElementById("app").innerHTML = `<div style="padding:24px;font-family:-apple-system,sans-serif;">
    <div style="font-weight:700;font-size:16px;margin-bottom:8px;">Farm Ledger hit an error while starting</div>
    <div style="font-size:13px;color:#555;">${(err && err.message ? err.message : String(err)).replace(/[<>]/g, "")}</div>
  </div>`;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).catch(() => {});
  });
}
</script>
