<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Farm Ledger</title>
<meta name="theme-color" content="#ECEFE8" />
<meta name="description" content="Herd tracking and farm expense ledger" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Farm Ledger" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<!-- REQUIRED: feeds Tom's Morning Board. Keep in every build. -->
<script src="board-feed.js"></script>
<link rel="stylesheet" href="vendor/leaflet.css" />
<script src="vendor/leaflet.js"></script>
<style>
:root{
  /* Palette: lichen stone, drumlin grass, heather, whin */
  --stone:#ECEFE8; --surface:#FFFFFF; --fill:#F4F6F1; --ink:#1B221D; --ink-2:#5E6B61; --ink-3:#9AA59C;
  --hair:rgba(27,34,29,.09);
  --grass:#2F5D3A; --grass-deep:#22452B; --grass-soft:#DEE9DA;
  --heather:#9A3F5C; --heather-soft:#F4E2E8;
  --whin:#C9920F; --whin-soft:#FBF0CF;
  /* legacy aliases so existing inline styles pick up the new palette */
  --paper:var(--stone); --surface-sunk:var(--fill); --muted:var(--ink-2); --muted-light:var(--ink-3);
  --pasture:var(--grass); --pasture-dark:var(--grass-deep); --pasture-light:var(--grass-soft);
  --rust:var(--heather); --rust-light:var(--heather-soft); --gold:var(--whin); --gold-light:var(--whin-soft);
  --line:var(--hair); --line-white:var(--hair);
  --font-display: ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-sans: -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-serif: var(--font-display); --font-mono: var(--font-display);
  --shadow: 0 1px 2px rgba(27,34,29,.05);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--stone);font-family:var(--font-sans);color:var(--ink);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px;}
.app{min-height:100vh;}

/* Header: large title per tab */
.header{padding:calc(14px + env(safe-area-inset-top)) 20px 12px;position:sticky;top:0;background:rgba(236,239,232,.88);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);z-index:20;}
.header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:2px;}
.h1{font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.05;margin:0;}
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);padding:6px 10px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;}
.sync-dot i{width:7px;height:7px;border-radius:50%;display:block;}
.build{font-size:10px;color:var(--ink-3);margin-top:6px;}
.main{padding:8px 16px 150px;}
.section-label{font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 4px 8px;}

/* Lists */
.card{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;min-height:64px;position:relative;}
.row + .row::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--hair);}
.row:active{background:var(--fill);}
.icon-chip{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.grow{flex:1;min-width:0;}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag-num{font-family:var(--font-display);font-weight:700;font-size:17px;}
.animal-name{font-family:var(--font-display);font-weight:600;font-size:17px;}
.sub{font-size:14px;color:var(--ink-2);margin-top:2px;}
.log-line{font-size:13px;margin-top:3px;color:var(--ink-3);}
.log-line.has-log{color:var(--grass-deep);}
.log-line b{font-weight:600;}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--grass-deep);background:var(--grass-soft);white-space:nowrap;}
.count-label{font-size:12px;color:var(--ink-3);}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.empty{background:var(--surface);border-radius:var(--r-lg);padding:44px 24px;text-align:center;}
.empty .circle{width:52px;height:52px;border-radius:16px;background:var(--grass-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty .t{font-family:var(--font-display);font-size:17px;font-weight:700;}
.empty .s{font-size:14px;color:var(--ink-2);margin:6px auto 0;max-width:240px;line-height:1.4;}
.alert-banner{border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;background:var(--heather-soft);}
.alert-banner .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--heather);margin-bottom:6px;}
.alert-banner .item{font-size:14px;padding:4px 0;line-height:1.35;}
.age-flag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--whin-soft);color:#7A5806;}

/* Finance */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.summary-card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;border-left:none!important;}
.summary-card .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.summary-card .val{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.01em;}
.chart-wrap{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;}
.chart-wrap .section-label{margin:0;}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:12px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
.chart-bar{width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--heather);}
.chart-val{font-size:10px;color:var(--ink-2);margin-bottom:4px;}
.chart-lbl{font-size:10px;color:var(--ink-2);margin-top:6px;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-head{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--ink-3);}
.cat-title{padding:16px 16px 2px;font-family:var(--font-display);font-size:17px;font-weight:700;}
.cat-row{padding:12px 16px;border-top:1px solid var(--hair);}
.cat-row-top{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;}
.cat-name-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
.cat-name{font-size:15px;font-weight:600;}
.cat-meta{font-size:12px;color:var(--ink-3);}
.cat-share{font-size:13px;color:var(--ink-2);}
.cat-total{font-family:var(--font-display);font-size:15px;font-weight:700;}
.bar-track{height:6px;border-radius:999px;background:var(--fill);margin-top:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;}
.entry-lines{margin-top:10px;padding-left:44px;display:flex;flex-direction:column;gap:4px;}
.entry-line{display:flex;gap:12px;font-size:13px;}
.entry-line .amt{min-width:60px;}
.entry-line .dt{color:var(--ink-3);}
.cat-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--hair);background:var(--fill);}
.cat-footer .flbl{font-size:14px;font-weight:600;color:var(--ink-2);}
.cat-footer .fval{font-family:var(--font-display);font-weight:800;font-size:17px;}
.entry-row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;position:relative;}
.entry-row + .entry-row::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--hair);}
.entry-amt{font-family:var(--font-display);font-weight:700;font-size:16px;flex-shrink:0;}
.entry-del{width:36px;height:36px;border-radius:10px;flex-shrink:0;color:var(--ink-3);display:flex;align-items:center;justify-content:center;}
.entry-del:active{background:var(--heather-soft);color:var(--heather);}

/* Land */
.map-container{width:100%;height:56vh;min-height:340px;border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;position:relative;background:#d7dcd3;z-index:0;isolation:isolate;}
.map-toolbar{position:absolute;bottom:12px;left:12px;right:12px;z-index:400;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.map-toolbar button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.22);}
.map-toolbar button.primary{background:var(--grass);color:#fff;}
.map-toolbar button.danger{color:var(--heather);}
.map-toolbar button:disabled{opacity:.5;}
.draw-hint{position:absolute;top:12px;left:12px;right:12px;z-index:400;background:rgba(27,34,29,.82);color:#fff;font-size:13px;padding:10px 14px;border-radius:14px;text-align:center;}
.no-map-fallback{background:var(--surface);border-radius:var(--r-lg);padding:24px;text-align:center;font-size:14px;color:var(--ink-2);margin-bottom:16px;}
.field-detail-stats{display:flex;gap:8px;margin-bottom:16px;}
.field-desc{font-size:15px;line-height:1.5;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px;}
.field-desc .lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px;}
.cattle-list{background:var(--surface);border-radius:var(--r-md);overflow:hidden;}
.cattle-list-row{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;}
.cattle-list-row + .cattle-list-row{border-top:1px solid var(--hair);}

/* Floating tab bar + add button */
.tabbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;justify-content:space-around;padding:6px;border-radius:26px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 30px rgba(27,34,29,.16),0 0 0 1px rgba(27,34,29,.05);z-index:30;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:20px;min-height:52px;justify-content:center;}
.tab-btn .ic{padding:2px 12px;border-radius:999px;display:flex;}
.tab-btn .lbl{font-size:11px;font-weight:600;}
.fab{position:fixed;right:20px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 82px);width:58px;height:58px;justify-content:center;align-items:center;background:var(--grass);border-radius:20px;box-shadow:0 10px 24px rgba(47,93,58,.38);z-index:31;display:flex;transition:transform .12s;}
.fab:active{transform:scale(.92);}

/* Bottom sheet */
.modal-overlay{position:fixed;inset:0;background:rgba(20,26,22,.38);z-index:2000;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out;}
.modal-box{width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:var(--stone);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 40px rgba(20,26,22,.2);animation:rise .32s cubic-bezier(.2,.9,.25,1);will-change:transform;}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px;}.modal-box{border-radius:var(--r-lg);}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.modal-head{flex-shrink:0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 12px 10px;touch-action:none;}
.modal-head::before{content:"";grid-column:1/-1;justify-self:center;width:38px;height:5px;border-radius:999px;background:rgba(27,34,29,.18);margin-bottom:10px;}
.modal-title{grid-column:2;text-align:center;font-family:var(--font-display);font-weight:700;font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.modal-close{grid-column:3;justify-self:end;width:32px;height:32px;border-radius:999px;background:rgba(27,34,29,.07);display:flex;align-items:center;justify-content:center;}
.modal-body{padding:4px 16px 0;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;}
.modal-body > :last-child:not(.sheet-foot){margin-bottom:calc(20px + env(safe-area-inset-bottom));}
.sheet-foot{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--stone) 70%,rgba(236,239,232,0));}

/* Grouped form rows (label and value on one line) */
.group-label{font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 4px 8px;}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden;margin-bottom:8px;}
.g-row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;position:relative;}
.g-row + .g-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair);}
.g-row > label{font-size:16px;flex-shrink:0;color:var(--ink);}
.g-row input,.g-row select,.g-row textarea{flex:1;min-width:0;border:none;background:transparent;text-align:right;padding:14px 0;outline:none;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;}
.g-row input::placeholder,.g-row textarea::placeholder{color:var(--ink-3);}
.g-row input[type=date]{min-height:48px;color:var(--grass-deep);}
.g-row input[type=date]::-webkit-date-and-time-value{text-align:right;}
.g-row.stack{flex-direction:column;align-items:stretch;gap:0;padding-top:12px;}
.g-row.stack > label{font-size:13px;font-weight:600;color:var(--ink-2);}
.g-row.stack textarea,.g-row.stack input{text-align:left;padding:6px 0 14px;}
.g-row textarea{resize:none;min-height:70px;line-height:1.4;}
.g-row .unit{color:var(--ink-3);font-size:16px;}
.g-row.ocr-filled,.g-row:has(.ocr-filled){background:var(--whin-soft);}
.ocr-filled{background:transparent!important;}
.hint{font-size:13px;color:var(--ink-2);margin:6px 4px 0;line-height:1.4;}

/* Hero amount */
.hero-amt{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:18px 0 8px;}
.hero-amt .cur{font-family:var(--font-display);font-size:34px;font-weight:700;color:var(--ink-3);}
.hero-amt input{font-family:var(--font-display);font-size:52px;font-weight:800;letter-spacing:-.02em;border:none;background:transparent;outline:none;width:1.4ch;max-width:80%;text-align:left;padding:0;}
.hero-amt input::placeholder{color:rgba(27,34,29,.18);}

/* Segmented control + chips */
.toggle-wrap{display:flex;border-radius:12px;padding:3px;background:rgba(27,34,29,.07);margin:4px 0 12px;}
.toggle-opt{flex:1;padding:9px;border-radius:10px;font-size:15px;font-weight:600;min-height:40px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;min-height:42px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:500;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);transition:background .12s,color .12s;}
.chip.on{background:var(--ink);color:#fff;box-shadow:none;}
.chip.on svg{stroke:#fff!important;}
.chips.tags .chip{font-family:var(--font-display);font-weight:700;min-width:64px;justify-content:center;}
.chips.tags .chip.on{background:var(--grass);}

/* Switch */
.switch{position:relative;width:51px;height:31px;flex-shrink:0;margin-left:auto;}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;}
.switch span{position:absolute;inset:0;border-radius:999px;background:rgba(27,34,29,.14);transition:background .18s;}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .18s;}
.switch input:checked + span{background:var(--grass);}
.switch input:checked + span::after{transform:translateX(20px);}

/* Scan / photo card */
.scan-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border-radius:var(--r-lg);background:var(--ink);color:#fff;text-align:center;padding:20px;cursor:pointer;position:relative;overflow:hidden;margin-top:4px;}
.scan-card input{display:none;}
.scan-card .t{font-family:var(--font-display);font-size:18px;font-weight:700;}
.scan-card .s{font-size:13px;opacity:.7;max-width:250px;line-height:1.35;}
.scan-card.light{background:var(--surface);color:var(--ink);min-height:100px;}
.scan-card .frame{position:absolute;inset:14px;border-radius:14px;pointer-events:none;background:
  linear-gradient(var(--whin),var(--whin)) top left/22px 3px no-repeat,linear-gradient(var(--whin),var(--whin)) top left/3px 22px no-repeat,
  linear-gradient(var(--whin),var(--whin)) top right/22px 3px no-repeat,linear-gradient(var(--whin),var(--whin)) top right/3px 22px no-repeat,
  linear-gradient(var(--whin),var(--whin)) bottom left/22px 3px no-repeat,linear-gradient(var(--whin),var(--whin)) bottom left/3px 22px no-repeat,
  linear-gradient(var(--whin),var(--whin)) bottom right/22px 3px no-repeat,linear-gradient(var(--whin),var(--whin)) bottom right/3px 22px no-repeat;}
.photo-thumb{width:100%;max-height:220px;object-fit:cover;border-radius:var(--r-lg);display:block;margin-top:4px;}
.scan-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:10px;border-radius:var(--r-md);background:var(--whin);color:#2A1F00;font-size:16px;font-weight:700;}
.ocr-status{font-size:13px;color:var(--ink-2);margin:8px 4px 0;min-height:18px;line-height:1.4;}

/* Buttons */
.btn-primary{width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:17px;color:#fff;background:var(--grass);transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.4;}
.btn-small{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;background:var(--grass);margin-top:12px;}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--grass-deep);background:var(--surface);}

/* Animal rows (herd import + livestock purchases) */
.imp-row + .imp-row{margin-top:12px;}
.imp-row.dup{opacity:.6;}
.imp-row .g-row select{text-align-last:right;}
.imp-flag{font-size:13px;font-weight:600;color:var(--heather);}
.tool-row{display:flex;gap:8px;margin:4px 0 4px;}

/* Detail sheets */
.stat-strip{display:flex;gap:8px;margin:4px 0 8px;}
.stat-box{flex:1;min-width:0;border-radius:var(--r-md);padding:12px 10px;text-align:center;background:var(--surface);}
.stat-box .l{font-size:12px;color:var(--ink-2);}
.stat-box .v{font-family:var(--font-display);font-weight:700;font-size:16px;margin-top:3px;}
.log-add-card{background:var(--surface);border-radius:var(--r-md);padding:14px 16px 16px;margin-bottom:8px;}
.log-add-card textarea{width:100%;border:none;background:var(--fill);border-radius:12px;padding:12px;min-height:70px;resize:none;outline:none;margin-top:10px;line-height:1.4;}
.log-add-card .chips{margin-bottom:10px;}
.log-add-card input[type=date]{border:none;background:var(--fill);border-radius:10px;padding:10px 12px;color:var(--grass-deep);min-height:42px;}
.log-hist{background:var(--surface);border-radius:var(--r-md);overflow:hidden;}
.log-hist-row{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;font-size:15px;padding:12px 16px;line-height:1.35;}
.log-hist-row + .log-hist-row{border-top:1px solid var(--hair);}
.log-hist-row .d{grid-row:1/3;font-size:13px;color:var(--ink-2);min-width:76px;padding-top:2px;}
.log-hist-row .t{font-weight:700;color:var(--grass-deep);}

function polygonAreaSqMeters(latlngs) {

// Copernicus Data Space Ecosystem (Sentinel Hub OGC) configuration instance.
const CDSE_INSTANCE = "1485fcf5-da2f-4b83-9ec2-9a03e1f7cf72";
const CDSE_WMS = "https://sh.dataspace.copernicus.eu/ogc/wms/" + CDSE_INSTANCE;
const CDSE_WFS = "https://sh.dataspace.copernicus.eu/ogc/wfs/" + CDSE_INSTANCE;

const GROWTH_SCRIPT = `//VERSION=3
function setup(){return{input:["B04","B08","SCL","dataMask"],output:{bands:4}};}
function evaluatePixel(s){
  if(!s.dataMask) return [0,0,0,0];
  if([3,8,9,10].indexOf(s.SCL)>=0) return [1,1,1,0.85];
  var n=(s.B08-s.B04)/(s.B08+s.B04+1e-6);
  var c=colorBlend(n,[0.1,0.3,0.5,0.7,0.85],[[0.55,0.35,0.2],[0.85,0.6,0.25],[0.95,0.9,0.35],[0.55,0.8,0.3],[0.1,0.5,0.15]]);

const imagery = {
  esri: null, growth: null, layers: null, usingBuiltIn: false, passDate: null, status: "",
  mode: (() => { try { const m = localStorage.getItem("fl-imagery"); return m === "growth" ? "growth" : "esri"; } catch (e) { return "esri"; } })(),
};
async function cdseLayers() {
  if (imagery.layers) return imagery.layers;
  let names = [];
  try {
    const res = await fetch(CDSE_WMS + "?service=WMS&request=GetCapabilities");
    const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
    names = Array.from(xml.querySelectorAll("Layer > Name")).map((n) => n.textContent.trim()).filter(Boolean);
  } catch (e) { console.warn("Couldn't read Copernicus layer list", e); }
  const colour = names.find((n) => /TRUE[_-]?COLOU?R/i.test(n)) || names.find((n) => /NATURAL/i.test(n)) || names.find((n) => !/NDVI|NDWI|MOIST|FALSE|SWIR|AGRI|GEOL|BATH|SCENE/i.test(n)) || "TRUE_COLOR";

// Edits keep the previous version in `history`, so an inspector can see what was changed and when.
function editStamp(old, rec) {
  const prev = Object.assign({}, old); delete prev.history;
  const history = (old.history || []).concat({ at: new Date().toISOString(), before: prev }).slice(-10);
  return { editedAt: new Date().toISOString(), history, createdAt: old.createdAt || null };
}
function editedNote(r) {

}

// Most recent batch number we know for this medicine: the latest purchase or the last time it was used.
function latestBatchFor(name) {

let doseSeed = null; // weights from the record being edited
function renderDoseWeights(noRecalc) {
  const box = document.getElementById("dose-weights"); if (!box) return;
  const keep = {};

  const tags = Array.from(document.querySelectorAll(".animal-chip.on")).map((c) => c.getAttribute("data-value"));

  box.innerHTML = tags.map((tag) => {

      : a.lastWeightKg ? { kg: a.lastWeightKg, est: a.lastWeightEst ? "est" : "weighed" }

  }).join("");

function medRecalcQty(fromDose) {
  const q = document.getElementById("f-med-qty"); if (!q) return;
  const type = (document.getElementById("f-med-dosetype") || {}).value || "fixed";
  const unit = (document.getElementById("f-med-unit") || {}).value || "";
  let total = null;
  if (type === "weight") {
    const amt = numIn("f-med-rate-amt"), per = numIn("f-med-rate-kg");
    let sum = 0, missing = 0;
    document.querySelectorAll(".dw-row").forEach((r) => {
      const kg = parseFloat(String(r.querySelector(".dw-kg").value).replace(/[^0-9.]/g, ""));
      const out = r.querySelector(".dw-dose");
      if (amt > 0 && per > 0 && kg > 0) { const d = round1((kg / per) * amt); sum += d; out.textContent = d + unit; }
      else { missing++; out.textContent = "–"; }
    });
    const rows = document.querySelectorAll(".dw-row").length;
    if (rows && !missing) total = round1(sum);
  } else {
    const dose = numIn("f-med-dose");
    const extra = (document.getElementById("f-med-extra-tags") || {}).value || "";
    const n = document.querySelectorAll(".animal-chip.on").length + extra.split(",").map((t) => t.trim()).filter(Boolean).length;
    if (dose > 0 && n) total = round1(dose * n);
  }
  if (total == null) return;
  if (q.dataset.manual === "1" && !fromDose) return;
  q.value = String(total); q.dataset.manual = ""; q.classList.add("ocr-filled");
}
// Dose details saved on the record (DAERA only needs the total; this is the per-animal breakdown).
function collectDoses(animalTags) {
  const type = (document.getElementById("f-med-dosetype") || {}).value || "fixed";
  if (type === "weight") {
    const amt = numIn("f-med-rate-amt"), per = numIn("f-med-rate-kg");
    const rows = Array.from(document.querySelectorAll(".dw-row"));
    const doses = rows.map((r) => {
      const kg = parseFloat(String(r.querySelector(".dw-kg").value).replace(/[^0-9.]/g, ""));
      return { tag: r.getAttribute("data-tag"), weightKg: kg > 0 ? kg : null, est: r.querySelector(".dw-est").value !== "weighed", dose: amt > 0 && per > 0 && kg > 0 ? round1((kg / per) * amt) : null };
    });
    if (rows.length && !(amt > 0 && per > 0)) return { error: "Put in the dose rate from the label, e.g. 1 ml per 10 kg." };
    const noWt = doses.filter((d) => !d.weightKg).map((d) => d.tag);
    if (noWt.length && !window.confirm(`No weight for ${noWt.join(", ")}, so no dose is worked out for ${noWt.length > 1 ? "them" : "it"}. Save anyway?`)) return { error: "Add the missing weights." };
    return { fields: { doseType: "weight", doseRate: amt > 0 && per > 0 ? { amount: amt, perKg: per } : null, dosePerHead: null, doses } };
  }
  const dose = numIn("f-med-dose");
  return { fields: { doseType: "fixed", dosePerHead: dose, doseRate: null, doses: dose ? animalTags.map((tag) => ({ tag, dose })) : [] } };
}

function saveCattlePurchaseEdit(id) {
  const old = state.purchases.find((x) => x.id === id); if (!old) return;
  const date = val("cp-date"), fromText = val("cp-from");
  if (!date || !fromText) { window.alert("The register needs the date moved on and where they came from."); return; }
  const costRaw = val("cp-cost"), cost = costRaw ? parseMoney(costRaw) : null;
  const notified = document.getElementById("cp-notified").checked;
  const rec = Object.assign({}, old, { date, fromText, supplier: fromText.split(",")[0].trim(), statementNo: val("cp-stmt"), cost, notified, notifiedAt: notified ? old.notifiedAt || new Date().toISOString() : null });
  Object.assign(rec, editStamp(old, rec));
  state.purchases[state.purchases.indexOf(old)] = rec;
  let herdChanged = false;
  state.herd.forEach((a) => {
    if (a.purchaseId !== id) return;
    if (a.onDate === old.date && a.onDate !== date) { a.onDate = date; herdChanged = true; }
    if ((a.fromText || "") === (old.fromText || "") && a.fromText !== fromText) { a.fromText = fromText; herdChanged = true; }
  });
  const fin = state.finance.find((e) => e.purchaseId === id);
  if (fin) {
    if (cost > 0) { fin.amount = cost; fin.date = date; fin.note = `${rec.supplier}${rec.statementNo ? " statement " + rec.statementNo : ""}: ${(rec.animalTags || []).length} cattle`; }

  persistPurchases(); if (herdChanged) persistHerd();
  state.modal = null; render();
}

/* ---------- feed: meal and silage rations, stock and cost ---------- */
// Rations are set once per group (kg per head per day) and counted every day automatically.
// Adjustments override a single day's totals (e.g. skipped meal, extra silage).
// Meal price comes from Feed expenses in Books tagged as meal with their weight.
// Silage cost per tonne comes from expenses tagged as silage-making cost divided by the pit size,
// or a typed estimate if nothing is tagged.
function feedData() {
  const f = state.feed || {};
  return { groups: f.groups || [], adjust: f.adjust || [], silage: f.silage || {} };
}
function persistFeed() {
  const f = feedData();
  state.feed = f;
  if (syncEnabled) { db.collection("farms").doc(FARM_CODE).set({ feed: f }, { merge: true }).catch((e) => console.error("sync write failed", e)); }
  else { saveJSON("feed", f); }
}
function feedAddDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function feedDaysBetween(a, b) { return Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000); }
function num(v) { const n = parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; }
function kgFmt(kg) { return kg >= 1000 ? (kg / 1000).toFixed(kg >= 10000 ? 0 : 1) + " t" : Math.round(kg) + " kg"; }
function money2(n) { return n.toLocaleString("en-GB", { style: "currency", currency: "GBP", minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function rationOn(g, day) {
  let r = null;
  (g.rations || []).forEach((x) => { if (x.from <= day && (!r || x.from >= r.from)) r = x; });
  return r;
}
function groupAnimalsOn(g, day) {
  const ids = new Set(g.animalIds || []);
  return state.herd.filter((a) => ids.has(a.id) && (!a.offDate || a.offDate > day) && (!a.dob || a.dob <= day));
}
// One day's feeding for a group: totals plus how they split across the animals.
function feedDay(g, day, adjMap) {
  const r = rationOn(g, day);
  const animals = groupAnimalsOn(g, day);
  const heads = animals.length;
  let meal = r ? (num(r.meal) || 0) * heads : 0;
  let silage = r ? rationSilage(r, heads) : 0;
  const adj = adjMap[g.id + "|" + day];
  if (adj) {
    if (adj.meal != null && adj.meal !== "") meal = num(adj.meal) || 0;
    if (adj.silage != null && adj.silage !== "") silage = num(adj.silage) || 0;
  }
  return { day, heads, animals, meal, silage, adj };
}
function adjMapOf(f) { const m = {}; f.adjust.forEach((a) => { m[a.groupId + "|" + a.date] = a; }); return m; }
function groupStart(g) { return (g.rations || []).reduce((m, r) => (!m || r.from < m ? r.from : m), null); }

// Walk every day from a group's first ration to `until` (inclusive).
function eachFeedDay(g, until, fn, adjMap) {
  const start = groupStart(g); if (!start || start > until) return;
  for (let d = start, i = 0; d <= until && i < 3660; d = feedAddDays(d, 1), i++) fn(feedDay(g, d, adjMap));
}

// ---- Silage pit geometry (feet in, kg out) ----
// Block size = grab width x bite depth x block height. If a block has been weighed,
// that weight sets the density, so the whole-pit tonnage is calibrated by it too.
const FT3_M3 = 0.0283168;
const PIT_DEFAULTS = { lenFt: 110, widFt: 23, htFt: 12, grabFt: 4, biteFt: 2.5, blockHtFt: 2.5, density: 700 };
function pitGeom(s) {
  s = s || {};
  const L = num(s.lenFt), W = num(s.widFt), H = num(s.htFt);
  if (!(L > 0 && W > 0 && H > 0)) return null;
  const grab = num(s.grabFt) > 0 ? num(s.grabFt) : PIT_DEFAULTS.grabFt;
  const bite = num(s.biteFt) > 0 ? num(s.biteFt) : PIT_DEFAULTS.biteFt;
  const bh = num(s.blockHtFt) > 0 ? num(s.blockHtFt) : PIT_DEFAULTS.blockHtFt;
  const blockM3 = grab * bite * bh * FT3_M3;
  const weighed = num(s.blockKg) > 0 ? num(s.blockKg) : null;
  const density = weighed ? weighed / blockM3 : (num(s.density) > 0 ? num(s.density) : PIT_DEFAULTS.density);
  const volM3 = L * W * H * FT3_M3;
  return { L, W, H, grab, bite, bh, weighed, density, volM3, tonnes: (volM3 * density) / 1000,
    blockKg: blockM3 * density, kgPerFt: W * H * FT3_M3 * density, across: W / grab, high: H / bh };
}
function pitTonnesOf(s) { const g = pitGeom(s); return g ? g.tonnes : num((s || {}).pitTonnes); }
function blockKgOf() { const g = pitGeom(feedData().silage); return g ? g.blockKg : null; }
function ftIn(ft) {
  if (!(ft > 0)) return "0′";
  let f = Math.floor(ft), i = Math.round((ft - f) * 12);
  if (i === 12) { f += 1; i = 0; }
  return i ? `${f}′${i}″` : `${f}′`;
}
// Silage for a whole group for one day: blocks (group total) win over kg per head.
function rationSilage(r, heads) {
  if (!r) return 0;
  if (num(r.blocks) > 0) {
    const bk = blockKgOf();
    return bk ? (num(r.blocks) / (num(r.every) > 1 ? num(r.every) : 1)) * bk : 0;
  }
  return (num(r.silage) || 0) * heads;
}
function rationText(r) {
  const meal = num(r.meal) || 0, bl = num(r.blocks) > 0 ? num(r.blocks) : 0, ev = num(r.every) > 1 ? num(r.every) : 1;
  if (!meal && !bl && !(num(r.silage) > 0)) return "Not being fed";
  if (!bl) return `${meal} kg meal + ${num(r.silage) || 0} kg silage per head a day`;
  const bk = blockKgOf();
  const blocks = `${bl} ${bl === 1 ? "block" : "blocks"} of silage ${ev > 1 ? `every ${ev} days` : "a day"}${bk ? ` (about ${kgFmt((bl / ev) * bk)} a day)` : " (set the grab size under Pit silage)"}`;
  return meal ? `${meal} kg meal a head a day + ${blocks}` : blocks;
}

function feedPrices() {
  const tagged = state.finance.filter((e) => e.kind === "expense" && e.feedUse);
  const meal = tagged.filter((e) => e.feedUse === "meal" && num(e.feedKg) > 0);
  const mealKg = meal.reduce((s, e) => s + num(e.feedKg), 0);
  const mealCost = meal.reduce((s, e) => s + e.amount, 0);
  const f = feedData();
  const sil = tagged.filter((e) => e.feedUse === "silage");
  const silCost = sil.reduce((s, e) => s + e.amount, 0);
  const pitT = pitTonnesOf(f.silage) ? Math.round(pitTonnesOf(f.silage)) : null;
  let silPerT = null, silSource = "";
  if (sil.length && pitT > 0) { silPerT = silCost / pitT; silSource = `${money2(silCost)} of silage costs in Books ÷ ${pitT} t`; }
  else if (num(f.silage.costPerTonne) > 0) { silPerT = num(f.silage.costPerTonne); silSource = "your estimate"; }
  return {
    mealPerKg: mealKg > 0 ? mealCost / mealKg : null, mealKg, mealCost, mealEntries: meal,
    mealFirst: meal.reduce((m, e) => (!m || e.date < m ? e.date : m), null),
    silPerKg: silPerT != null ? silPerT / 1000 : null, silPerT, silSource, silEntries: sil, silCost,
  };
}

function feedSummary() {
  const f = feedData(), adjMap = adjMapOf(f), today = todayStr(), p = feedPrices();
  const monthStart = today.slice(0, 8) + "01";
  const out = { today: { meal: 0, silage: 0, heads: 0 }, month: { meal: 0, silage: 0 }, total: { meal: 0, silage: 0 },
    mealSince: 0, silSince: 0, perGroup: {}, perAnimal: {}, recent: [] };
  const silFrom = f.silage.openedOn || null;
  f.groups.forEach((g) => {
    const G = (out.perGroup[g.id] = { meal: 0, silage: 0, month: { meal: 0, silage: 0 }, today: null, days: 0 });
    eachFeedDay(g, today, (d) => {
      G.meal += d.meal; G.silage += d.silage;
      out.total.meal += d.meal; out.total.silage += d.silage;
      if (d.day >= monthStart) { G.month.meal += d.meal; G.month.silage += d.silage; out.month.meal += d.meal; out.month.silage += d.silage; }
      if (p.mealFirst && d.day >= p.mealFirst) out.mealSince += d.meal;
      if (silFrom && d.day >= silFrom) out.silSince += d.silage;
      if (d.heads && (d.meal || d.silage)) {
        d.animals.forEach((a) => {
          const A = (out.perAnimal[a.id] = out.perAnimal[a.id] || { meal: 0, silage: 0, groupId: g.id });
          A.meal += d.meal / d.heads; A.silage += d.silage / d.heads;
        });
      }
      if (d.day === today) { G.today = d; out.today.meal += d.meal; out.today.silage += d.silage; out.today.heads += d.heads; }
      if (feedDaysBetween(d.day, today) < 14) out.recent.push({ g, d });
    }, adjMap);
  });
  const cost = (m, s) => (p.mealPerKg != null ? m * p.mealPerKg : 0) + (p.silPerKg != null ? s * p.silPerKg : 0);
  out.cost = { today: cost(out.today.meal, out.today.silage), month: cost(out.month.meal, out.month.silage), total: cost(out.total.meal, out.total.silage) };
  out.costOf = cost;
  out.prices = p;
  // Stock left: what was bought (meal) or made (pit) minus what's been fed since.
  out.mealLeft = p.mealKg > 0 ? p.mealKg - out.mealSince : null;
  const pitKg = pitTonnesOf(f.silage) > 0 ? pitTonnesOf(f.silage) * 1000 : null;
  out.silLeft = pitKg != null && silFrom ? pitKg - out.silSince : null;
  return out;
}
function runOut(left, perDay) {
  if (left == null) return null;
  if (left <= 0) return { days: 0, date: todayStr() };
  if (!perDay) return null;
  const days = Math.floor(left / perDay);
  return { days, date: feedAddDays(todayStr(), days) };
}

function renderFeed() {
  const f = feedData();
  const S = feedSummary(), p = S.prices;
  let html = "";
  if (!f.groups.length) {
    html += emptyState("wheat", "No feeding set up yet", "Make a group of calves, tell it the meal and silage per head per day, and Farm Ledger counts it every day for you.");
    html += `<div style="text-align:center;margin-top:-8px"><button class="btn-ghost" data-action="feed-new-group">${icon("plus", { size: 14 })} New feeding group</button></div>`;
    html += pitCard(S, f);
    html += feedCostsSection(S, f);
    return html;
  }
  const priced = p.mealPerKg != null || p.silPerKg != null;
  html += `<div class="summary-grid">
    ${summaryCard("Meal today", kgFmt(S.today.meal), "wheat", "var(--whin, #b8860b)")}
    ${summaryCard("Silage today", kgFmt(S.today.silage), "wheat", "var(--pasture)")}
    ${summaryCard("Cost today", priced ? money2(S.cost.today) : "Set prices", "wallet", "var(--rust)")}
    ${summaryCard("This month", priced ? (S.cost.month < 100 ? money2(S.cost.month) : currency(S.cost.month)) : "–", "wallet", "var(--ink)")}
  </div>`;

  // Stock
  const mealRun = runOut(S.mealLeft, S.today.meal), silRun = runOut(S.silLeft, S.today.silage);
  const turnout = f.silage.turnout || null;
  let silLine = "Set your pit size and the date you opened it.";
  if (S.silLeft != null) {
    silLine = `About ${kgFmt(Math.max(0, S.silLeft))} left`;
    if (silRun) silLine += silRun.days === 0 ? " · finished" : ` · lasts to ${formatShortDate(silRun.date)}`;
    if (turnout && S.today.silage) {
      const need = Math.max(0, feedDaysBetween(todayStr(), turnout)) * S.today.silage;
      silLine += need > S.silLeft ? ` · <b style="color:var(--rust)">short ${kgFmt(need - S.silLeft)} before turnout</b>` : ` · enough to turnout`;
    }
  }
  let mealLine = "Tag your meal purchases in Books with their weight.";
  if (S.mealLeft != null) {
    mealLine = `About ${kgFmt(Math.max(0, S.mealLeft))} left of ${kgFmt(p.mealKg)} bought`;
    if (mealRun) mealLine += mealRun.days === 0 ? " · order now" : ` · runs out ${formatShortDate(mealRun.date)}`;
  }
  html += `<h2 class="section-label">Stock</h2><div class="card">
    <button class="row" data-action="feed-costs"><span class="icon-chip" style="background:var(--whin-soft)">${icon("wheat", { size: 14, color: "#7A5806" })}</span><span class="grow"><div class="cat-name">Meal</div><div class="sub">${mealLine}</div></span>${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}</button>
    <button class="row" data-action="feed-silage"><span class="icon-chip" style="background:var(--pasture-light)">${icon("wheat", { size: 14, color: "var(--pasture-dark)" })}</span><span class="grow"><div class="cat-name">Pit silage</div><div class="sub">${silLine}</div></span>${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}</button>
  </div>`;

  html = html.replace('<h2 class="section-label">Stock</h2>', pitCard(S, f) + '<h2 class="section-label">Stock</h2>');
  // Groups
  html += `<h2 class="section-label">Feeding groups</h2><div class="card">`;
  f.groups.forEach((g) => {
    const today = todayStr();
    const r = rationOn(g, today);
    const G = S.perGroup[g.id];
    const heads = groupAnimalsOn(g, today).length;
    const perHeadDay = r && heads ? S.costOf(num(r.meal) || 0, rationSilage(r, heads) / heads) : 0;
    const skipped = G.today && G.today.adj && num(G.today.adj.meal) === 0 && G.today.adj.meal !== "" && G.today.adj.meal != null;
    const ration = r ? rationText(r) : `Starts ${formatShortDate(groupStart(g))}`;
    html += `<div class="feed-group">
      <button class="row" data-action="feed-open-group" data-id="${g.id}">
        <span class="icon-chip" style="background:var(--pasture-light)">${icon("tag", { size: 14, color: "var(--pasture-dark)" })}</span>
        <span class="grow"><div class="cat-name truncate">${esc(g.name)} <span class="sub">· ${heads} head</span></div>
          <div class="sub">${ration}</div>
          ${perHeadDay ? `<div class="sub">${money2(perHeadDay)} a head a day · ${currency(S.costOf(G.meal, G.silage))} so far</div>` : ""}
          ${G.today && G.today.adj ? `<div class="sub" style="color:var(--whin, #b8860b)">Today: ${kgFmt(G.today.meal)} meal, ${kgFmt(G.today.silage)} silage${G.today.adj.note ? " · " + esc(G.today.adj.note) : ""}</div>` : ""}
        </span>${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}
      </button>
      <div class="feed-actions">
        <button class="fqa-btn" data-action="feed-skip" data-id="${g.id}">${skipped ? "Undo skip" : "No meal tonight"}</button>
        <button class="fqa-btn" data-action="feed-adjust" data-id="${g.id}">Different today</button>
        <button class="fqa-btn" data-action="feed-ration" data-id="${g.id}">Change ration</button>
      </div>
    </div>`;
  });
  html += `</div><div style="margin:-6px 0 16px"><button class="btn-ghost" data-action="feed-new-group">${icon("plus", { size: 14 })} New feeding group</button></div>`;

  html += feedCostsSection(S, f);

  // Last 14 days
  const byDay = {};
  S.recent.forEach(({ g, d }) => { (byDay[d.day] = byDay[d.day] || []).push({ g, d }); });
  const days = Object.keys(byDay).sort().reverse();
  if (days.length) {
    html += `<h2 class="section-label">Last 14 days</h2><div class="card">${days.map((day) => {
      const list = byDay[day];
      const m = list.reduce((s, x) => s + x.d.meal, 0), si = list.reduce((s, x) => s + x.d.silage, 0);
      const adj = list.some((x) => x.d.adj);
      return `<div class="entry-row"><span class="grow"><div class="cat-name">${formatShortDate(day)}${adj ? ` <span class="sub" style="color:var(--whin, #b8860b)">· changed</span>` : ""}</div><div class="sub">${kgFmt(m)} meal · ${kgFmt(si)} silage</div></span><span class="entry-amt">${priced ? money2(S.costOf(m, si)) : ""}</span></div>`;
    }).join("")}</div>`;
  }
  return html;
}

function feedCostsSection(S, f) {

    <button class="row" data-action="feed-costs"><span class="grow"><div class="cat-name">Meal ${p.mealPerKg != null ? `${currency(p.mealPerKg * 1000)} a tonne` : ""}</div>

function saveFeedGroup(id) {

}

function pitCard(S, f) {
  const g = pitGeom(f.silage);
  if (!g) return `<h2 class="section-label">Silage pit</h2><div class="card"><button class="row" data-action="feed-silage"><span class="icon-chip" style="background:var(--pasture-light)">${icon("wheat", { size: 14, color: "var(--pasture-dark)" })}</span><span class="grow"><div class="cat-name">Add your pit measurements</div><div class="sub">Length, width, height and your grab's block size. Then you can see how far into the pit you are.</div></span>${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}</button></div>`;
  const totalKg = g.tonnes * 1000;
  const opened = f.silage.openedOn || null;
  const eatenKg = opened ? Math.max(0, Math.min(S.silSince, totalKg)) : 0;
  const leftKg = totalKg - eatenKg;
  const eatenFt = eatenKg / g.kgPerFt;
  const todayFt = Math.min(S.today.silage / g.kgPerFt, eatenFt);
  const pct = totalKg ? (eatenKg / totalKg) * 100 : 0;
  const run = runOut(leftKg, S.today.silage);
  // Side view of the pit, open face on the left. Width 340 units; height drawn taller than scale so the block rows are readable.
  const X0 = 10, X1 = 330, Y0 = 26, Y1 = 98, sx = (X1 - X0) / g.L, sy = (Y1 - Y0) / g.H;
  const faceX = X0 + eatenFt * sx;
  const lines = [];
  for (let ft = g.bite; ft < g.L - 0.01; ft += g.bite) { const x = X0 + ft * sx; if (x > faceX + 0.5) lines.push(`<line x1="${x.toFixed(1)}" y1="${Y0}" x2="${x.toFixed(1)}" y2="${Y1}" />`); }
  for (let h = g.bh; h < g.H - 0.01; h += g.bh) { const y = Y1 - h * sy; lines.push(`<line x1="${Math.max(faceX, X0).toFixed(1)}" y1="${y.toFixed(1)}" x2="${X1}" y2="${y.toFixed(1)}" />`); }
  const faceLbl = eatenFt > 0.05 ? `Face ${ftIn(eatenFt)} in` : "Face";
  const lblX = Math.min(Math.max(faceX, X0 + 30), X1 - 30);
  const svg = `<svg viewBox="0 0 340 122" role="img" aria-label="Silage pit side view: ${Math.round(pct)}% eaten, face about ${ftIn(eatenFt)} into the ${g.L} foot pit">
    <rect x="${X0}" y="${Y0}" width="${X1 - X0}" height="${Y1 - Y0}" rx="3" fill="none" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" />
    <rect x="${faceX.toFixed(1)}" y="${Y0}" width="${(X1 - faceX).toFixed(1)}" height="${Y1 - Y0}" rx="2" fill="var(--grass)" />
    <g stroke="rgba(255,255,255,.22)" stroke-width="1">${lines.join("")}</g>
    ${todayFt > 0.01 ? `<rect x="${(faceX - Math.max(4, todayFt * sx)).toFixed(1)}" y="${Y0}" width="${Math.max(4, todayFt * sx).toFixed(1)}" height="${Y1 - Y0}" fill="var(--whin)" />` : ""}
    <line x1="${faceX.toFixed(1)}" y1="${Y0 - 6}" x2="${faceX.toFixed(1)}" y2="${Y1 + 4}" stroke="var(--ink)" stroke-width="1.5" />
    <text x="${lblX.toFixed(1)}" y="${Y0 - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${faceLbl}</text>
    <line x1="${X0}" y1="${Y1 + 1}" x2="${X1}" y2="${Y1 + 1}" stroke="var(--ink-2)" stroke-width="2" />
    <text x="${X0}" y="${Y1 + 17}" font-size="10" fill="var(--ink-2)">Open end</text>
    <text x="${X1}" y="${Y1 + 17}" text-anchor="end" font-size="10" fill="var(--ink-2)">${g.L}′ · back wall</text>
  </svg>`;
  const blocksTaken = g.blockKg ? Math.round(eatenKg / g.blockKg) : 0;
  const perCut = Math.round(g.across * g.high);
  return `<h2 class="section-label">Silage pit</h2>
  <div class="pit-card" role="button" tabindex="0" data-action="feed-silage" style="cursor:pointer">
    <div class="pit-big"><b>${Math.round(pct)}%</b><span>eaten · ${kgFmt(leftKg)} left of ${Math.round(g.tonnes)} t</span></div>
    ${svg}
    <div class="pit-key"><span><i style="background:var(--grass)"></i>Silage left</span>${todayFt > 0.01 ? `<span><i style="background:var(--whin)"></i>Today's blocks</span>` : ""}<span><i style="border:1px dashed var(--ink-3)"></i>Eaten</span></div>
    <div class="pit-stats">
      <div><b>${kgFmt(eatenKg)}</b>eaten since ${opened ? formatShortDate(opened) : "–"}</div>
      <div><b>${blocksTaken}</b>blocks out, about ${Math.round(g.blockKg)} kg each</div>
      <div><b>${S.today.silage ? kgFmt(S.today.silage) : "–"}</b>going out a day</div>
      <div><b>${run ? (run.days === 0 ? "Finished" : formatShortDate(run.date)) : "–"}</b>${run ? (run.days === 0 ? "" : `lasts ${run.days} days at this rate`) : "no silage being fed"}</div>
    </div>
    ${opened ? "" : `<div class="hint" style="margin:10px 0 0">Set the date you opened the pit to start counting.</div>`}
    <div class="hint" style="margin:10px 0 0">One cut across the face is about ${perCut} blocks and moves it back ${ftIn(g.bite)}. Worked out from what you feed, so pace the face now and then. If it's further in than shown, your blocks are heavier than set.</div>
  </div>`;
}

function renderLivestock() {
  const herdNow = activeHerd();
  if (herdNow.length === 0) {
    return herdTools() + emptyState("tag", "No animals yet", "Scan your herd list to add everyone at once, or tap + to add a single calf.");
  }
  const sorted = [...herdNow].sort((a, b) => a.dob.localeCompare(b.dob)); // oldest (earliest dob) first

  const flagged = sorted
    .map((a) => ({ a, alert: checkAgeAlert(a.dob) }))
    .filter((x) => x.alert);

  let banner = "";
  if (flagged.length > 0) {
    const items = flagged.map(({ a, alert }) => {
      const msg = alert.status === "over"
        ? `#${esc(a.tag)}${a.name ? " · " + esc(a.name) : ""} — already past 28 months`
        : `#${esc(a.tag)}${a.name ? " · " + esc(a.name) : ""} — reaches 28 months in ${Math.ceil(alert.daysUntil / 7)} week${Math.ceil(alert.daysUntil / 7) === 1 ? "" : "s"}`;
      return `<div class="item">${msg}</div>`;
    }).join("");
    banner = `<div class="alert-banner"><div class="h">${icon("tag", { size: 14, color: "var(--rust)" })} Approaching 28 months</div>${items}</div>`;
  }

  const rows = sorted.map((a) => {
    const age = formatAge(calcAge(a.dob));
    const logs = [...a.logs].sort((x, y) => y.date.localeCompare(x.date));
    const latest = logs[0];
    const alert = checkAgeAlert(a.dob);
    return `<button class="row" data-action="open-animal" data-id="${a.id}">
      <span class="icon-chip" style="background:var(--pasture-light)">${icon("tag", { size: 14, color: "var(--pasture-dark)" })}</span>
      <span class="grow">
        <span class="tag-num">#${esc(a.tag)}</span>${a.name ? ` <span class="animal-name">${esc(a.name)}</span>` : ""}
        <div class="sub truncate">${esc(a.sex)}${a.breed ? ", " + esc(a.breed) : ""}</div>
        <div class="log-line truncate ${latest ? "has-log" : ""}">${latest ? `<b>${esc(latest.type)}</b> · ${formatShortDate(latest.date)}${latest.note ? " — " + esc(latest.note) : ""}` : "No logs yet"}</div>
      </span>
      <span class="right-col">
        <span class="pill">${age}</span>
        <span class="count-label">${a.logs.length} ${a.logs.length === 1 ? "log" : "logs"}</span>
        ${alert ? `<span class="age-flag">${alert.status === "over" ? "Over 28mo" : "28mo soon"}</span>` : ""}
      </span>
      ${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}
    </button>`;
  }).join("");
  return `${herdTools()}<h2 class="section-label">${herdNow.length} ${herdNow.length === 1 ? "animal" : "animals"}, oldest first</h2>${banner}<div class="card">${rows}</div>`;
}

function groupByCategory(entries) {
  const map = {};
  entries.forEach((e) => {
    if (!map[e.category]) map[e.category] = { value: 0, entries: [] };
    map[e.category].value += e.amount;
    map[e.category].entries.push(e);
  });
  return map;
}

function categoryTable(title, data, total, totalLabel, accentVar, accentLightVar, metaMap) {
  if (data.length === 0) return "";
  const rowsHtml = data.map((c) => {
    const meta = metaMap[c.name] || { icon: "circle" };
    const share = total > 0 ? (c.value / total) * 100 : 0;
    const entryLines = c.entries.map((e) => `<div class="entry-line"><span class="amt">${currency(e.amount)}</span><span class="dt">${formatShortDate(e.date)}</span></div>`).join("");
    return `<div class="cat-row">
      <div class="cat-row-top">
        <div class="cat-name-wrap">
          <span class="icon-chip" style="background:${accentLightVar}">${icon(meta.icon, { size: 12, color: accentVar })}</span>
          <span><div class="cat-name truncate">${esc(c.name)}</div><div class="cat-meta">${c.entries.length} ${c.entries.length === 1 ? "entry" : "entries"}</div></span>
        </div>
        <span class="cat-share">${share.toFixed(0)}%</span>
        <span class="cat-total">${currency(c.value)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${share}%;background:${accentVar}"></div></div>
      <div class="entry-lines">${entryLines}</div>
    </div>`;
  }).join("");
  return `<div class="card">
    ${title ? `<div class="cat-title">${title}</div>` : ""}
    <div class="cat-head"><span>Category</span><span style="text-align:right">Share</span><span style="text-align:right">Total</span></div>
    ${rowsHtml}
    <div class="cat-footer"><span class="flbl">${totalLabel}</span><span class="fval" style="color:${accentVar}">${currency(total)}</span></div>
  </div>`;
}

function renderFinance() {
  const revenue = state.finance.filter((e) => e.kind === "revenue").reduce((s, e) => s + e.amount, 0);
  const expenses = state.finance.filter((e) => e.kind === "expense").reduce((s, e) => s + e.amount, 0);
  const gross = revenue - expenses;
  const margin = revenue > 0 ? (gross / revenue) * 100 : 0;

  const expMap = groupByCategory(state.finance.filter((e) => e.kind === "expense"));
  const categoryData = EXPENSE_CATEGORIES.filter((c) => expMap[c]).map((c) => ({ name: c, value: expMap[c].value, entries: expMap[c].entries.slice().sort((a, b) => b.date.localeCompare(a.date)) })).sort((a, b) => b.value - a.value);

  const revMap = groupByCategory(state.finance.filter((e) => e.kind === "revenue"));
  const revenueData = REVENUE_CATEGORIES.filter((c) => revMap[c]).map((c) => ({ name: c, value: revMap[c].value, entries: revMap[c].entries.slice().sort((a, b) => b.date.localeCompare(a.date)) })).sort((a, b) => b.value - a.value);

  let html = `<div class="summary-grid">
    ${summaryCard("Revenue", currency(revenue), "trendUp", "var(--pasture)")}
    ${summaryCard("Expenses", currency(expenses), "trendDown", "var(--rust)")}
    ${summaryCard("Gross profit", currency(gross), gross >= 0 ? "trendUp" : "trendDown", gross >= 0 ? "var(--pasture)" : "var(--rust)")}
    ${summaryCard("Margin", margin.toFixed(1) + "%", "wallet", "var(--ink)")}
  </div>`;

  if (categoryData.length > 0) {
    const maxVal = Math.max(...categoryData.map((c) => c.value));
    const bars = categoryData.map((c) => `<div class="chart-col">
        <span class="chart-val">${currency(c.value)}</span>
        <div class="chart-bar" style="height:${maxVal > 0 ? (c.value / maxVal) * 100 : 0}%"></div>
        <span class="chart-lbl">${esc(c.name)}</span>
      </div>`).join("");
    html += `<div class="chart-wrap"><div class="section-label" style="margin-bottom:0">Expenses by category</div><div class="chart-bars">${bars}</div></div>`;
  }

  html += categoryTable("", categoryData, expenses, "Total expenses", "var(--rust)", "var(--rust-light)", CATEGORY_META);
  html += categoryTable("Revenue by category", revenueData, revenue, "Total revenue", "var(--pasture)", "var(--pasture-light)", REVENUE_CATEGORY_META);

  html += `<h2 class="section-label">All entries</h2>`;
  if (state.finance.length === 0) {
    html += emptyState("wallet", "No entries yet", "Log an expense or a sale to start tracking gross profit.");
  } else {
    const rows = state.finance.map((e) => {
      const meta = (e.kind === "expense" ? CATEGORY_META[e.category] : REVENUE_CATEGORY_META[e.category]) || { icon: "circle" };
      const color = e.kind === "expense" ? "var(--rust)" : "var(--pasture)";
      const bg = e.kind === "expense" ? "var(--rust-light)" : "var(--pasture-light)";
      return `<div class="entry-row">
        <span class="icon-chip" style="background:${bg}">${icon(meta.icon, { size: 14, color })}</span>
        <span class="grow">
          <div class="cat-name truncate">${esc(e.category)}</div>
          <div class="sub truncate">${e.date}${e.note ? " · " + esc(e.note) : ""}</div>
        </span>
        <span class="entry-amt" style="color:${color}">${e.kind === "expense" ? "\u2212" : "+"}${currency(e.amount)}</span>
        <button class="entry-del" data-action="delete-entry" data-id="${e.id}" aria-label="Delete entry">${icon("trash", { size: 15 })}</button>
      </div>`;
    }).join("");
    html += `<div class="card">${rows}</div>`;
  }
  return html;
}

function summaryCard(label, value, iconName, color) {
  return `<div class="summary-card" style="border-left:3px solid ${color}">
    <div class="lbl">${icon(iconName, { size: 12, color })} ${label}</div>
    <div class="val" style="color:${color}">${value}</div>
  </div>`;
}

function emptyState(iconName, title, sub) {
  return `<div class="empty"><div class="circle">${icon(iconName, { size: 20, color: "var(--pasture-dark)" })}</div><div class="t">${title}</div><div class="s">${sub}</div></div>`;
}

const FIELD_TYPE_COLORS = { Grazing: "#2FB866", Cutting: "#E0A800" };

function cattleInField(fieldId) {
  return state.herd.filter((a) => a.fieldId === fieldId);
}

function renderLand() {
  const totalAcres = state.fields.reduce((s, f) => s + (Number(f.acreage) || 0), 0);
  const mapAvailable = typeof L !== "undefined";

  let mapHtml;
  if (!mapAvailable) {
    mapHtml = `<div class="no-map-fallback">
      Satellite map couldn't load (no internet connection to the map service). Your field data is safe.
      <div style="margin-top:10px;"><button class="btn-small" data-action="open-add-field-manual">Add field manually</button></div>
    </div>`;
  } else {
    mapHtml = `<div class="map-container ${mapFull ? "map-full" : ""}">
      <div id="leaflet-slot" style="width:100%;height:100%;"></div>
      ${drawState.active
        ? `<div class="draw-hint">${drawState.editingId ? `Redrawing ${esc((state.fields.find((x) => x.id === drawState.editingId) || {}).name || "field")}: tap` : "Tap"} the map to place boundary points, then Finish</div>
           <div class="map-toolbar">
             <button data-action="undo-point" id="draw-undo-btn" disabled>Undo point</button>
             <span style="align-self:center;font-size:12px;color:#fff;background:rgba(33,29,24,.7);padding:6px 12px;border-radius:999px;" id="draw-point-count">0 points</span>
             <button class="primary" data-action="finish-field" id="draw-finish-btn" disabled>Finish</button>
             <button class="danger" data-action="cancel-field">Cancel</button>
           </div>`
        : `<div class="map-toolbar top"><button class="primary" data-action="start-draw">${icon("plus", { size: 14 })} Draw field</button></div>
           <div class="gps-status" id="gps-status" style="display:none"></div>
           <div class="field-card" id="field-card" style="display:none"></div>
           <div class="imagery-switch"><button data-action="imagery" data-mode="esri" class="${imagery.mode === "esri" ? "on" : ""}">Photo</button><button data-action="imagery" data-mode="growth" class="${imagery.mode === "growth" ? "on" : ""}">Grass growth</button></div>
           <div class="imagery-status" id="imagery-status"></div>
           <button class="map-full-btn" data-action="map-fullscreen" aria-label="${mapFull ? "Exit full screen" : "Full screen"}">${mapFull ? "Exit full screen" : "Full screen"}</button>
           ${jumpBarHtml()}`
      }
    </div>`;
  }

  let listHtml = "";
  if (state.fields.length === 0) {
    listHtml = emptyState("map", "No fields mapped yet", "Tap \"Draw new field\" and trace its boundary directly on the satellite image.");
  } else {
    const rows = state.fields.map((f) => {
      const color = FIELD_TYPE_COLORS[f.type] || "var(--pasture)";
      const count = cattleInField(f.id).length;
      return `<button class="row" data-action="open-field" data-id="${f.id}">
        <span class="icon-chip" style="background:${color}">${icon("map", { size: 14, color: "#fff" })}</span>
        <span class="grow">
          <span class="animal-name">${esc(f.name)}</span>
          <div class="sub">${f.acreage.toFixed ? f.acreage.toFixed(1) : f.acreage} acres · ${esc(f.type)}</div>
        </span>
        <span class="right-col">
          <span class="pill">${count} ${count === 1 ? "animal" : "animals"}</span>
        </span>
        ${icon("chevronRight", { size: 16, color: "var(--muted-light)" })}
      </button>`;
    }).join("");
    listHtml = `<div class="card">${rows}</div>`;
  }

  return `<h2 class="section-label">${state.fields.length} ${state.fields.length === 1 ? "Field" : "Fields"} · ${totalAcres.toFixed(1)} acres total</h2>${mapHtml}${listHtml}`;
}

function renderModal() {
  const m = state.modal;
  if (!m) return "";
  if (m.type === "addCalf") return modalWrap("New calf", addCalfForm());
  if (m.type === "addEntry") return modalWrap("New entry", addEntryForm());
  if (m.type === "animal") {
    const a = state.herd.find((x) => x.id === m.id);
    if (!a) return "";
    return modalWrap(`#${esc(a.tag)}${a.name ? " · " + esc(a.name) : ""}`, animalDetailBody(a));
  }
  if (m.type === "addField") return modalWrap("New field", addFieldForm(m.computedAcres));
  if (m.type === "field") {
    const f = state.fields.find((x) => x.id === m.id);
    if (!f) return "";
    return modalWrap(f.name, fieldDetailBody(f));
  }
  if (m.type === "addMedicine") { const r = m.id && state.medicine.find((x) => x.id === m.id); return modalWrap(r ? "Edit medicine record" : "Log medicine", addMedicineForm(r || null)); }
  if (m.type === "medProducts") return modalWrap("Your medicines", medProductsList());
  if (m.type === "medProduct") return modalWrap(m.id ? "Edit medicine" : "New medicine", medProductForm(medProducts().find((p) => p.id === m.id) || null));
  if (m.type === "editCattlePurchase") { const r = state.purchases.find((x) => x.id === m.id); if (!r) return ""; return modalWrap("Edit cattle purchase", cattlePurchaseEditForm(r)); }
  if (m.type === "medicine") {
    const rec = state.medicine.find((x) => x.id === m.id);
    if (!rec) return "";
    return modalWrap(rec.productName || "Medicine record", medicineDetailBody(rec));
  }
  if (m.type === "addPurchase") { const r = m.id && state.purchases.find((x) => x.id === m.id); return modalWrap(r ? "Edit purchase" : "Log purchase", addPurchaseForm(r || null)); }
  if (m.type === "fieldCattle") {
    const cf = state.fields.find((x) => x.id === m.id);
    if (!cf) return "";
    return modalWrap(`Cattle in ${esc(cf.name)}`, fieldCattleForm(cf));
  }
  if (m.type === "editField") {
    const ef = state.fields.find((x) => x.id === m.id);
    if (!ef) return "";
    return modalWrap(`Edit ${esc(ef.name)}`, editFieldForm(ef));
  }
  if (m.type === "feedGroup") { const g = m.id && feedData().groups.find((x) => x.id === m.id); return modalWrap(g ? `Edit ${esc(g.name)}` : "New feeding group", feedGroupForm(g || null)); }
  if (m.type === "feedGroupDetail") { const g = feedData().groups.find((x) => x.id === m.id); if (!g) return ""; return modalWrap(esc(g.name), feedGroupDetail(g)); }
  if (m.type === "feedRation") { const g = feedData().groups.find((x) => x.id === m.id); if (!g) return ""; return modalWrap(`Ration · ${esc(g.name)}`, feedRationForm(g)); }
  if (m.type === "feedAdjust") { const g = feedData().groups.find((x) => x.id === m.id); if (!g) return ""; return modalWrap(`Different today · ${esc(g.name)}`, feedAdjustForm(g)); }
  if (m.type === "feedCosts") return modalWrap("Meal prices from Books", feedCostsForm(!!m.all, m.draft));
  if (m.type === "feedSilage") return modalWrap("Pit silage", feedSilageForm());
  if (m.type === "addDisposal") { const r = m.id && state.medicine.find((x) => x.id === m.id); return modalWrap(r ? "Edit disposal" : "Record disposal", addDisposalForm(r || null)); }
  if (m.type === "places") return modalWrap("Map places", placesForm());
  if (m.type === "addCattle") return modalWrap("Cattle bought in", addCattleForm());
  if (m.type === "keeper") return modalWrap("Herd details", keeperForm());
  if (m.type === "registerAnimal") {
    const ra = state.herd.find((x) => x.id === m.id);
    if (!ra) return "";
    return modalWrap(`Register · ${esc(ra.tag)}`, registerAnimalForm(ra));
  }
  if (m.type === "importHerd") return modalWrap("Scan herd list", importHerdForm());
  if (m.type === "purchase") {
    const rec = state.purchases.find((x) => x.id === m.id);
    if (!rec) return "";
    return modalWrap(rec.productName || "Purchase record", purchaseDetailBody(rec));
  }
  return "";
}

function modalWrap(title, bodyHtml) {
  return `<div class="modal-overlay" data-action="close-modal">
    <div class="modal-box" id="sheet" onclick="event.stopPropagation()" role="dialog" aria-label="${title}">
      <div class="modal-head" id="sheet-head"><h3 class="modal-title">${title}</h3><button class="modal-close" data-action="close-modal" aria-label="Close">${icon("x", { size: 15, color: "var(--ink-2)", strokeWidth: 2.6 })}</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  </div>`;
}

// Tappable chip group that writes its choice into a hidden input (id = target).
function chipGroup(target, options, selected, extraClass) {
  return `<input type="hidden" id="${target}" value="${esc(selected)}" />
    <div class="chips ${extraClass || ""}">${options.map((o) => {
      const val = typeof o === "string" ? o : o.value;
      const label = typeof o === "string" ? o : o.label;
      return `<button type="button" class="chip ${val === selected ? "on" : ""}" data-action="pick-chip" data-target="${target}" data-value="${esc(val)}">${label}</button>`;
    }).join("")}</div>`;
}

function fieldOptions(selectedId) {
  const none = `<option value="" ${!selectedId ? "selected" : ""}>Unassigned</option>`;
  const opts = state.fields.map((f) => `<option value="${f.id}" ${f.id === selectedId ? "selected" : ""}>${esc(f.name)}</option>`).join("");
  return none + opts;
}

function addCalfForm() {
  const fieldOpts = [{ value: "", label: "Unassigned" }, ...state.fields.map((f) => ({ value: f.id, label: esc(f.name) }))];
  return `
    <div class="group">
      <div class="g-row"><label for="f-tag">Tag number</label><input id="f-tag" inputmode="numeric" placeholder="Required" autocomplete="off" /></div>
      <div class="g-row"><label for="f-name">Name</label><input id="f-name" placeholder="Optional" /></div>
      <div class="g-row"><label for="f-breed">Breed</label><input id="f-breed" placeholder="e.g. Aberdeen Angus" /></div>
      <div class="g-row"><label for="f-dob">Born</label><input type="date" id="f-dob" /></div>
    </div>
    <div class="group-label">Sex</div>
    ${chipGroup("f-sex", ["Heifer", "Bull", "Steer"], "Heifer")}
    ${state.fields.length ? `<div class="group-label">Field</div>${chipGroup("f-field", fieldOpts, "")}` : `<input type="hidden" id="f-field" value="" />`}
    <div class="sheet-foot"><button class="btn-primary" data-action="save-calf">Add to herd</button></div>
  `;
}

function addEntryForm() {
  const isExp = state.entryKind === "expense";
  const metaMap = isExp ? CATEGORY_META : REVENUE_CATEGORY_META;
  const cats = isExp ? EXPENSE_CATEGORIES : REVENUE_CATEGORIES;
  const accent = isExp ? "var(--heather)" : "var(--grass)";
  const opts = cats.map((c) => ({ value: c, label: `${icon((metaMap[c] || {}).icon || "circle", { size: 15, color: "var(--ink-2)" })}${c}` }));
  return `
    <div class="toggle-wrap">
      <button class="toggle-opt" data-action="set-entry-kind" data-kind="expense" style="background:${isExp ? "#fff" : "transparent"};color:${isExp ? "var(--heather)" : "var(--ink-2)"}">Expense</button>
      <button class="toggle-opt" data-action="set-entry-kind" data-kind="revenue" style="background:${!isExp ? "#fff" : "transparent"};color:${!isExp ? "var(--grass)" : "var(--ink-2)"}">Revenue</button>
    </div>
    <div class="hero-amt" style="color:${accent}"><span class="cur">£</span><input type="text" inputmode="decimal" id="f-amount" placeholder="0" autocomplete="off" oninput="this.style.width=Math.max(1,this.value.length)+0.4+'ch'" aria-label="Amount in pounds" style="color:${accent}" /></div>
    <div class="group-label">Category</div>
    ${chipGroup("f-category", opts, cats[0])}
    <div class="group-label">Details</div>
    <div class="group">
      <div class="g-row"><label for="f-date">Date</label><input type="date" id="f-date" value="${todayStr()}" /></div>
      <div class="g-row"><label for="f-note">Note</label><input id="f-note" placeholder="Optional" /></div>
    </div>
    <div class="sheet-foot"><button class="btn-primary" style="background:${accent}" data-action="save-entry">Save ${isExp ? "expense" : "revenue"}</button></div>
  `;
}

function animalDetailBody(a) {
  const age = calcAge(a.dob);
  const stats = [{ l: "Age", v: formatAge(age) }, { l: "Born", v: formatShortDate(a.dob) }, { l: "Sex", v: a.sex }];
  const statHtml = stats.map((s) => `<div class="stat-box"><div class="l">${s.l}</div><div class="v truncate">${esc(s.v)}</div></div>`).join("");
  const logs = [...a.logs].sort((x, y) => y.date.localeCompare(x.date));
  const logHtml = logs.length === 0
    ? `<div class="log-none">Nothing logged yet</div>`
    : `<div class="log-hist">${logs.map((l) => `<div class="log-hist-row"><span class="d">${formatShortDate(l.date)}</span><span class="t">${esc(l.type)}</span><span>${esc(l.note)}</span></div>`).join("")}</div>`;
  return `
    <div class="stat-strip">${statHtml}</div>
    <div class="group">
      ${a.breed ? `<div class="g-row"><label>Breed</label><span style="margin-left:auto;color:var(--ink-2)">${esc(a.breed)}</span></div>` : ""}
      <div class="g-row"><label for="f-reassign-field">Field</label><select id="f-reassign-field" data-action-change="reassign-field" data-id="${a.id}">${fieldOptions(a.fieldId)}</select></div>
    </div>
    <div class="group-label">Add to log</div>
    <div class="log-add-card">
      ${chipGroup("f-log-type", ["Injection", "Medication", "Weight check", "Note"], "Injection")}
      <input type="date" id="f-log-date" value="${todayStr()}" aria-label="Date" />
      <textarea id="f-log-note" placeholder="What was done?"></textarea>
      <button class="btn-small" data-action="save-log" data-id="${a.id}">${icon("plus", { size: 14, color: "#fff", strokeWidth: 2.6 })} Log it</button>
    </div>
    <div class="group-label">History</div>
    ${logHtml}
    <button class="btn-ghost" style="margin-top:16px" data-action="open-register-animal" data-id="${a.id}">Herd register details · move off / death</button>
    <button class="remove-link" data-action="remove-animal" data-id="${a.id}">Delete animal (entered by mistake)</button>
  `;
}

function fieldCattleForm(f) {
  const herd = activeHerd().slice().sort((a, b) => (a.fieldId === f.id ? 0 : 1) - (b.fieldId === f.id ? 0 : 1) || String(a.tag).localeCompare(String(b.tag), undefined, { numeric: true }));
  if (!herd.length) return `<div class="hint">No cattle in the herd yet. Add them on the Livestock tab first.</div>`;
  const fieldName = (id) => { const x = state.fields.find((q) => q.id === id); return x ? x.name : ""; };
  return `<div class="hint" style="margin-bottom:10px">Tick the cattle that are in ${esc(f.name)}. An animal can only be in one field, so ticking one that's elsewhere moves it here.</div>
    <div class="fc-tools"><button class="fqa-btn" data-action="fc-all">Select all</button><button class="fqa-btn" data-action="fc-none">Clear</button></div>

/* ---------- herd import (photo of herd list / docket) ---------- */
const BREED_CODES = {
  AA: "Aberdeen Angus", AAX: "Aberdeen Angus cross", AN: "Aberdeen Angus",
  LIM: "Limousin", LIMX: "Limousin cross", LM: "Limousin", LMX: "Limousin cross",
  CH: "Charolais", CHX: "Charolais cross", CHA: "Charolais",
  SIM: "Simmental", SIMX: "Simmental cross", SM: "Simmental", SMX: "Simmental cross",
  BB: "Belgian Blue", BBX: "Belgian Blue cross",
  HF: "Holstein Friesian", HFX: "Holstein Friesian cross", FR: "Friesian", FRX: "Friesian cross", HO: "Holstein",
  HE: "Hereford", HER: "Hereford", HEX: "Hereford cross",
  SA: "Salers", SAL: "Salers", SAX: "Salers cross",
  SH: "Shorthorn", SHX: "Shorthorn cross",
  BA: "Blonde d'Aquitaine", BAX: "Blonde d'Aquitaine cross",
  AU: "Aubrac", AUX: "Aubrac cross", PA: "Parthenaise", PAR: "Parthenaise",
  JE: "Jersey", JEX: "Jersey cross", GA: "Galloway", HI: "Highland", DX: "Dexter", MRI: "Meuse-Rhine-Issel",
};

function normTag(t) { return String(t || "").replace(/\s+/g, "").toLowerCase(); }

/* ---------- photo reading (works offline) ----------
   The reader engine and English data live in /ocr/ on this site; the service worker keeps them on the phone,
   so labels and dockets can be read with no signal. If the on-phone reader can't start (very old phone),
   it falls back to the online reader used before. */
const LocalOCR = (() => {
  let w = null, ready = null, seq = 0, pending = {};
  const simd = () => { try { return WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11])); } catch (e) { return false; } };
  function call(msg, transfer) {
    return new Promise((res, rej) => { const id = ++seq; pending[id] = { res, rej }; w.postMessage(Object.assign({ id }, msg), transfer || []); });
  }
  async function blobUrl(path) { const r = await fetch(path); if (!r.ok) throw new Error(path + " " + r.status); return URL.createObjectURL(await r.blob()); }
  function start() {
    if (ready) return ready;
    ready = (async () => {
      const [workerUrl, coreUrl, langRes] = await Promise.all([
        blobUrl("ocr/ocr-worker.js"),
        blobUrl(simd() ? "ocr/tesseract-core-simd-lstm.wasm.js" : "ocr/tesseract-core-lstm.wasm.js"),
        fetch("ocr/eng.traineddata"),
      ]);
      if (!langRes.ok) throw new Error("language data " + langRes.status);
      const lang = await langRes.arrayBuffer();
      w = new Worker(workerUrl);
      w.onmessage = (e) => { const p = pending[e.data.id]; if (!p) return; delete pending[e.data.id]; e.data.ok ? p.res(e.data.text || "") : p.rej(new Error(e.data.error)); };
      w.onerror = (e) => { e.preventDefault && e.preventDefault(); Object.values(pending).forEach((p) => p.rej(new Error("reader crashed"))); pending = {}; w = null; ready = null; };
      await call({ type: "init", coreUrl, lang }, [lang]);
      return true;
    })();
    ready.catch(() => { if (w) { try { w.terminate(); } catch (e) {} } w = null; ready = null; });
    return ready;
  }
  function dataUrlBytes(dataUrl) {
    const b64 = String(dataUrl).split(",")[1] || "";
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
  return {
    async recognize(dataUrl) { await start(); const buf = dataUrlBytes(dataUrl); return call({ type: "recognize", image: buf }, [buf]); },
  };
})();
function loadOnlineTesseract() {
  if (typeof Tesseract !== "undefined") return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("online reader unavailable")); document.head.appendChild(sc); });
}
async function ocrImage(dataUrl) {
  try { return await LocalOCR.recognize(dataUrl); }
  catch (e) {
    console.warn("On-phone reader failed, trying the online reader", e);
    await loadOnlineTesseract();
    const result = await Tesseract.recognize(dataUrl, "eng");
    return (result && result.data && result.data.text) || "";
  }
}

// Pull one animal per line: needs an ear tag and at least one date. The earliest
// date on the line is taken as date of birth (movement dates come after it).
function parseHerdList(text) {
  const out = [];
  const seen = new Set();
  const dateRe = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g;
  const pageHasUkTags = /\bU\s?K\s?\d/i.test(text); // if so, ignore lines without one (headers, footers)
  text.split(/\r?\n/).forEach((raw) => {
    const line = raw.replace(/[|_]/g, " ").replace(/\s+/g, " ").trim();
    if (!line) return;
    const dates = [...line.matchAll(dateRe)].map((m) => {
      let d = m[1], mo = m[2], y = m[3];
      if (y.length === 2) y = (Number(y) > 50 ? "19" : "20") + y;
      if (y.length !== 4 || Number(mo) < 1 || Number(mo) > 12 || Number(d) < 1 || Number(d) > 31) return null;
      return `${y}-${mo.padStart(2, "0")}-${d.padStart(2, "0")}`;
    }).filter(Boolean).sort();
    if (!dates.length) return;
    const noDates = line.replace(dateRe, " ");
    let tag = null, tagText = null;
    const uk = noDates.match(/\bU\s?K\s?(\d[\d ]{8,18}\d)/i);
    if (uk) { tag = ("UK" + uk[1]).replace(/\s+/g, " ").trim(); tagText = uk[0]; }
    else if (!pageHasUkTags) {
      const m = noDates.match(/\b\d[\d ]{4,16}\d\b/);
      if (m) { tag = m[0].replace(/\s+/g, " ").trim(); tagText = m[0]; }
    }
    if (!tag || seen.has(normTag(tag))) return;
    seen.add(normTag(tag));
    const rest = noDates.replace(tagText, " ");
    let sex = "";
    if (/\b(female|heifer|cow)\b/i.test(rest) || /\bF\b/.test(rest)) sex = "Heifer";
    else if (/\b(steer|bullock)\b/i.test(rest)) sex = "Steer";
    else if (/\b(male|bull)\b/i.test(rest) || /\bM\b/.test(rest)) sex = "Bull";
    let breed = "";
    for (const t of rest.toUpperCase().match(/\b[A-Z]{2,4}\b/g) || []) { if (BREED_CODES[t]) { breed = BREED_CODES[t]; break; } }
    out.push({ tag, dob: dates[0], sex: sex || "Heifer", breed });
  });
  return out;
}

function herdMatch(tag) {
  const key = normTag(tag);
  const exact = state.herd.find((a) => normTag(a.tag) === key);
  if (exact) return { kind: "exact", a: exact };
  const partial = state.herd.find((a) => normTag(a.tag).length >= 3 && key.endsWith(normTag(a.tag)));
  return partial ? { kind: "partial", a: partial } : null;
}

  return `<div class="imp-row group ${include ? "" : "dup"}">
    ${opts.selectable ? `<div class="g-row"><label>${flag ? `<span class="imp-flag">${flag}</span>` : "Add this animal"}</label><span class="switch"><input type="checkbox" class="imp-include" ${include ? "checked" : ""} onchange="this.closest('.imp-row').classList.toggle('dup',!this.checked)" /><span></span></span></div>` : ""}
    <div class="g-row"><label>Tag</label><input class="imp-tag" value="${esc(a.tag || "")}" placeholder="Required" autocapitalize="characters" autocomplete="off" /></div>
    <div class="g-row"><label>Born</label><input type="date" class="imp-dob" value="${esc(a.dob || "")}" /></div>
    <div class="g-row"><label>Sex</label><select class="imp-sex">${["Heifer", "Bull", "Steer"].map((x) => `<option ${x === (a.sex || "Heifer") ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="g-row"><label>Breed</label><input class="imp-breed" value="${esc(a.breed || "")}" placeholder="Optional" /></div>
    ${opts.removable ? `<div class="g-row"><button type="button" onclick="this.closest('.imp-row').remove()" style="margin-left:auto;color:var(--heather);font-size:15px;font-weight:600;min-height:44px">Remove animal</button></div>` : ""}
  </div>`;
}

        : "Couldn't pick out any animals. Retake the photo straight on, with the whole table in frame and no shadows.";
    } catch (e) {
      console.error("herd OCR failed", e);
      if (status) status.textContent = "Couldn't read the list this time. Retake the photo flat and in good light.";
    }
  }).catch(() => { if (status) status.textContent = "Couldn't open that photo. Try taking it again."; });

function saveImport() {
  const rows = readAnimalRows(document.getElementById("imp-rows"));
  if (!rows.length) { window.alert("Nothing selected to add."); return; }
  const missing = rows.filter((r) => !r.dob);
  if (missing.length) { window.alert(`Add a date of birth for: ${missing.map((r) => r.tag).join(", ")}`); return; }
  let added = 0; const skipped = [];
  rows.forEach((r) => {
    const m = herdMatch(r.tag);
    if (m && m.kind === "exact") { skipped.push(r.tag); return; }
    state.herd.unshift({ id: uid(), tag: r.tag, name: "", dob: r.dob, sex: r.sex, breed: r.breed, fieldId: null, logs: [] });
    added++;
  });
  if (added) persistHerd();
  state.modal = null;
  render();
  if (skipped.length) window.alert(`Added ${added}. Already in your herd, so skipped: ${skipped.join(", ")}`);
}
